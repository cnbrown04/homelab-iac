---
# The opkssh client config of scripts/opkssh-login.sh. The client "opkssh" in
# Pocket ID is a public client, so this file holds no secret.
default_provider: pocketid
providers:
  - alias: pocketid
    issuer: https://auth.buildwithcaleb.com
    client_id: opkssh
    # The policy on each host checks the group, so the token needs groups.
    scopes: openid email profile groups
    redirect_uris:
      - http://localhost:3000/login-callback
      - http://localhost:10001/login-callback
      - http://localhost:11110/login-callback
