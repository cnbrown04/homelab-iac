# Deploys hermes with Ansible. See AGENTS.md, "The pipelines".
#
# - A pull request: lint, then a check run that shows the changes.
# - A push to main: lint, then a check run. If the check shows a change, an
#   apply follows, then a second run that must show no change. The environment
#   "hermes" needs the approval of the owner. See decision 8 in AGENTS.md. A
#   push with no change needs no approval.
# - A change to mise.toml starts the jobs only when it changes a tool of
#   Ansible.
# - Each Monday, a check run looks for drift. It fails when the check shows a
#   change, and it does not apply.
name: ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - "mise.toml"
      - ".github/workflows/ansible-hermes.yml"
      - ".github/actions/ansible-setup/**"
      - ".github/actions/ansible-access/**"
      - ".github/actions/changes/**"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "mise.toml"
      - ".github/workflows/ansible-hermes.yml"
      - ".github/actions/ansible-setup/**"
      - ".github/actions/ansible-access/**"
      - ".github/actions/changes/**"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Apply after approval, also when the check shows no change. A check
          run does not run command tasks, so it cannot see each change.
        type: boolean
        default: false
  # Monday at 12:00 UTC.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

# One deploy at a time for hermes. A new deploy waits, and does not cancel an
# apply. Each pull request has its own group, so it does not wait for a deploy,
# and a new commit cancels the old check.
concurrency:
  group: ansible-hermes-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/changes
        id: changes
        with:
          paths: >-
            ansible/**
            .github/workflows/ansible-hermes.yml
            .github/actions/ansible-setup/**
            .github/actions/ansible-access/**
            .github/actions/changes/**
          tools: python ansible-core pypi:ansible-lint uv sops age

  # Lint and check in one job, so the setup runs one time.
  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changes: ${{ steps.check.outputs.changes }}
    env:
      # A pull request from a fork gets no secrets, so the check runs only for
      # a branch of this repository.
      TRUSTED: >-
        ${{ github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ansible-setup
      # The lint tools run before a step writes a secret to the runner.
      - name: Lint
        working-directory: ansible
        run: ansible-lint
      - name: Check the syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/site.yml
      - uses: ./.github/actions/ansible-access
        if: env.TRUSTED == 'true'
        with:
          ssh-key: ${{ secrets.HERMES_SSH_KEY }}
          become-password: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
      - name: Show the changes for hermes
        id: check
        if: env.TRUSTED == 'true'
        working-directory: ansible
        # No color codes, so the recap line starts with the host name.
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ANSIBLE_FORCE_COLOR: "0"
          ANSIBLE_NOCOLOR: "1"
        run: |
          set -o pipefail
          ansible-playbook playbooks/site.yml --check --diff --limit hermes \
            -e @"$RUNNER_TEMP/become.json" | tee "$RUNNER_TEMP/check.txt"
          if grep -qE '^hermes .*changed=[1-9]' "$RUNNER_TEMP/check.txt"; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            # The names of the changed tasks only. The diff stays in the log.
            {
              echo "### ansible: the check shows changes."
              echo
              echo "These tasks change. Read the log of this step for the diff."
              echo
              awk '
                /^(TASK|RUNNING HANDLER) \[/ {
                  task = $0
                  sub(/^(TASK|RUNNING HANDLER) \[/, "", task)
                  sub(/\] \**$/, "", task)
                }
                /^changed: \[/ { print "- " task }
              ' "$RUNNER_TEMP/check.txt" | uniq
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "### ansible: no changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail on drift
        if: github.event_name == 'schedule' && steps.check.outputs.changes == 'true'
        run: |
          echo "::error::hermes is not the same as main. Read the job summary for the changed tasks."
          exit 1

  apply:
    # The weekly drift check does not apply.
    if: >-
      github.event_name != 'pull_request'
      && github.event_name != 'schedule'
      && (needs.check.outputs.changes == 'true' || inputs.force)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: hermes
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ansible-setup
      - uses: ./.github/actions/ansible-access
        with:
          ssh-key: ${{ secrets.HERMES_SSH_KEY }}
          become-password: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
      - name: Apply to hermes
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/site.yml --diff --limit hermes
          -e @"$RUNNER_TEMP/become.json"
      - name: Check that a second run changes nothing
        working-directory: ansible
        # No color codes, so the recap line starts with the host name.
        env:
          ANSIBLE_FORCE_COLOR: "0"
          ANSIBLE_NOCOLOR: "1"
        run: |
          set -o pipefail
          ansible-playbook playbooks/site.yml --check --limit hermes \
            -e @"$RUNNER_TEMP/become.json" | tee "$RUNNER_TEMP/verify.txt"
          if grep -E '^hermes .*changed=[1-9]' "$RUNNER_TEMP/verify.txt"; then
            echo "::error::The check run after the apply shows a change. The playbook is not idempotent."
            exit 1
          fi
