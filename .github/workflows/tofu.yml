# Plans and applies the OpenTofu targets. See AGENTS.md, "The pipelines".
#
# - A pull request: format and validate, then a plan for each target. The
#   plan does not lock the state, because nothing applies it.
# - A push to main: a plan for each target. A target with changes waits for the
#   approval of the owner, then the saved plan is applied.
# - A change to mise.toml starts the jobs only when it changes a tool of
#   OpenTofu.
# - Each Monday, a plan of each target looks for drift. It fails when the plan
#   has changes, and it does not apply.
name: infrastructure

on:
  pull_request:
    paths:
      - "tofu/**"
      - "secrets/tofu.sops.yaml"
      - "scripts/tofu-env.sh"
      - "mise.toml"
      - ".github/workflows/tofu.yml"
      - ".github/workflows/tofu-target.yml"
      - ".github/actions/tofu-setup/**"
      - ".github/actions/changes/**"
      - ".github/actions/mise-install/**"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "secrets/tofu.sops.yaml"
      - "scripts/tofu-env.sh"
      - "mise.toml"
      - ".github/workflows/tofu.yml"
      - ".github/workflows/tofu-target.yml"
      - ".github/actions/tofu-setup/**"
      - ".github/actions/changes/**"
      - ".github/actions/mise-install/**"
  workflow_dispatch:
  # Monday at 12:00 UTC.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/changes
        id: changes
        with:
          paths: >-
            tofu/**
            secrets/tofu.sops.yaml
            scripts/tofu-env.sh
            .github/workflows/tofu.yml
            .github/workflows/tofu-target.yml
            .github/actions/tofu-setup/**
            .github/actions/changes/**
            .github/actions/mise-install/**
          tools: opentofu sops age

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mise-install
        with:
          tools: opentofu
      - name: Check the format
        run: tofu fmt -check -recursive -diff tofu
      - name: Validate each target
        run: |
          for target in tofu/targets/*/; do
            echo "Validate $target"
            tofu -chdir="$target" init -backend=false -no-color > /dev/null
            tofu -chdir="$target" validate -no-color
          done

  target:
    # A pull request from a fork gets no secrets, so the plan runs only for a
    # branch of this repository.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        target: [atlas, pantheon]
    uses: ./.github/workflows/tofu-target.yml
    with:
      target: ${{ matrix.target }}
      apply: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
      fail-on-changes: ${{ github.event_name == 'schedule' }}
      lock: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
