# Plans one OpenTofu target, and applies the saved plan after approval. The
# workflow tofu.yml calls this workflow once for each target.
name: infrastructure target

on:
  workflow_call:
    inputs:
      target:
        description: The OpenTofu target, atlas or pantheon.
        type: string
        required: true
      apply:
        description: Apply the plan after the approval of the owner.
        type: boolean
        default: false
      fail-on-changes:
        description: Fail when the plan has changes. The weekly drift check uses this.
        type: boolean
        default: false
      lock:
        description: >-
          Lock the state for the plan. The plan of a pull request writes no
          state, and no job applies it, so it does not wait for the lock.
        type: boolean
        default: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      # The drift check has its own group, so it does not cancel a plan of a push.
      group: tofu-plan-${{ inputs.target }}-${{ inputs.fail-on-changes && 'drift' || github.ref }}
      cancel-in-progress: true
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: tofu/targets/${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tofu-setup
        with:
          target: ${{ inputs.target }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
          headscale-authkey: ${{ secrets.HEADSCALE_AUTHKEY }}

      - name: Initialize
        run: tofu init -no-color

      # Exit code 0 is no change, 2 is a change, and 1 is an error.
      - name: Plan
        id: plan
        env:
          LOCK: ${{ inputs.lock }}
        run: |
          set +e
          tofu plan -no-color -lock="$LOCK" -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the plan to the job summary
        env:
          TARGET: ${{ inputs.target }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            echo "### infrastructure plan: $TARGET"
            if [ "$CHANGES" = "true" ]; then
              echo "The plan has changes."
            else
              echo "No changes."
            fi
            echo "<details><summary>The plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: inputs.fail-on-changes && steps.plan.outputs.changes == 'true'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "::error::$TARGET is not the same as main. Read the plan in the job summary."
          exit 1

      # OpenTofu encrypts the saved plan with the state passphrase.
      - name: Keep the plan for the apply job
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.target }}
          path: tofu/targets/${{ inputs.target }}/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment has the owner as the required reviewer. See decision 8
    # in AGENTS.md.
    environment: ${{ inputs.target }}
    concurrency:
      group: tofu-apply-${{ inputs.target }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: tofu/targets/${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tofu-setup
        with:
          target: ${{ inputs.target }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
          headscale-authkey: ${{ secrets.HEADSCALE_AUTHKEY }}

      - name: Initialize
        run: tofu init -no-color

      - name: Get the saved plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.target }}
          path: tofu/targets/${{ inputs.target }}

      # The apply uses the exact plan that the owner approved. OpenTofu stops
      # if the state changed after the plan.
      - name: Apply the saved plan
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: Check that a new plan shows no change
        run: tofu plan -no-color -lock-timeout=5m -detailed-exitcode
