name: Find the relevant changes
description: >-
  Decide if a workflow must run. A change to mise.toml counts only when it
  changes a tool of the workflow, or the env or settings of mise. A run by
  hand always counts. The workflow must check out the repository first.
inputs:
  paths:
    description: >-
      The git pathspecs that count, apart from mise.toml. Separate them with
      spaces.
    required: true
  tools:
    description: The tools of mise.toml that the workflow uses. Separate them with spaces.
    required: true
outputs:
  run:
    description: The string "true" when the workflow must run.
    value: ${{ steps.changes.outputs.run }}
runs:
  using: composite
  steps:
    - name: Compare the commit with its base
      id: changes
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE: ${{ github.event.before }}
        PATHSPECS: ${{ inputs.paths }}
        TOOLS: ${{ inputs.tools }}
      run: |
        decide() {
          echo "run=$1" >> "$GITHUB_OUTPUT"
          echo "$2"
          exit 0
        }

        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$PUSH_BASE" ;;
          *) decide true "A run by hand always runs." ;;
        esac

        # A new branch or a force push has no usable base.
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --quiet --depth=1 origin "$base"; then
          decide true "No base commit. Run the workflow."
        fi

        read -ra specs <<< "$PATHSPECS"
        if ! git diff --quiet "$base" HEAD -- "${specs[@]/#/:(glob)}"; then
          decide true "A file of the workflow changed."
        fi
        if git diff --quiet "$base" HEAD -- mise.toml; then
          decide false "No file of the workflow changed."
        fi

        # The system Python of the runner has tomllib. The mise Python is not
        # installed at this point.
        git show "$base:mise.toml" > "$RUNNER_TEMP/mise.base.toml"
        if python3 - "$RUNNER_TEMP/mise.base.toml" mise.toml $TOOLS <<'EOF'
        import sys
        import tomllib

        old_path, new_path, *tools = sys.argv[1:]
        with open(old_path, "rb") as f:
            old = tomllib.load(f)
        with open(new_path, "rb") as f:
            new = tomllib.load(f)

        def view(config):
            return (
                {tool: config.get("tools", {}).get(tool) for tool in tools},
                config.get("env"),
                config.get("settings"),
            )

        sys.exit(1 if view(old) != view(new) else 0)
        EOF
        then
          decide false "mise.toml changed, but not for the tools of the workflow."
        fi
        decide true "mise.toml changed for the tools of the workflow."
