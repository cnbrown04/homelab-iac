name: Give Ansible access to the hosts
description: >-
  Write the SSH key for Ansible. The sudo password is in
  ansible/inventory/group_vars/all/secrets.sops.yml, so Ansible reads it with
  SOPS_AGE_KEY.
inputs:
  ssh-key:
    description: The private SSH key of the pipeline.
    required: true
runs:
  using: composite
  steps:
    - name: Set up SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        install -d -m 700 ~/.ssh
        install -m 600 /dev/null ~/.ssh/id_ed25519
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        # The repository holds the host key, so SSH checks it.
        install -m 644 ansible/known_hosts ~/.ssh/known_hosts
