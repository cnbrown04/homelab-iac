[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .ansible/collections:~/.ansible/collections
host_key_checking = True
retry_files_enabled = False
# The inventory has 7 hosts. The default is 5.
forks = 10
# Mitogen keeps one Python process on each host for the run, so a task does
# not start a new one. A check of hermes takes 24 s, not 67 s. ansible-core
# deprecates third-party strategy plugins, with no date for the removal. To
# turn Mitogen off, delete these two lines.
strategy_plugins = plugins/strategy
strategy = mitogen_linear
# Before Ansible connects, log in with opkssh when the key is old. The plugin
# skips the pipeline. bin_ansible_callbacks runs it for ansible ad hoc too.
callback_plugins = plugins/callback
callbacks_enabled = opkssh_login
bin_ansible_callbacks = True
deprecation_warnings = True
vars_plugins_enabled = host_group_vars,community.sops.sops
# Use ansible_facts['name']. Top-level fact variables go away in ansible-core 2.24.
inject_facts_as_vars = False
# Gather the facts of a host one time for each run, not one time for each
# play. A local run in the next 30 minutes uses the same facts. A task that
# needs new facts runs ansible.builtin.setup itself. Each play sets
# gather_subset.
gathering = smart
fact_caching = jsonfile
# Ansible reads a relative path from the current folder, so use a fixed path.
fact_caching_connection = ~/.cache/ansible/facts/homelab-iac
fact_caching_timeout = 1800

[ssh_connection]
pipelining = True
# One SSH connection for each host. The default also turns on compression,
# which costs CPU and gives nothing for small modules. The connection stays
# open for 5 minutes, so the next local run does not log in again.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s
