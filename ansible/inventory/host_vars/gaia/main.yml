---
# gaia has an address on the VLAN of the typhon cluster, and it serves NFS to it.
proxmox_network_vlan_interfaces:
  - vlan: 20
    address: 10.0.20.5/24

# The pool lethe is the old TrueNAS pool styx. The owner imported it on
# 29 September 2026. Only the typhon VLAN can mount the exports.
zfs_nfs_pool: lethe
zfs_nfs_datasets:
  - name: lethe/k8s
  # The shares of mnemosyne, one folder for each user. User 3000 owns each
  # file: Samba forces it, and OpenCloud runs as it. Samba keeps the macOS
  # metadata in extended attributes, and OpenCloud keeps its IDs there.
  - name: lethe/shares
    properties:
      xattr: sa
      # ZFS shows posixacl by its canonical name, posix.
      acltype: posix
    owner: "3000"
    group: "3000"
    mode: "0770"
# The folders of the static volumes that need an owner. The migrate step of
# Its a Plan runs as user 1000, the same as iac-admin.
zfs_nfs_directories:
  - path: /lethe/k8s/itsaplan
    owner: iac-admin
    group: iac-admin
    mode: "0755"
  - path: /lethe/k8s/itsaplan/Backups
    owner: iac-admin
    group: iac-admin
    mode: "0755"
zfs_nfs_exports:
  # The dynamic volumes of csi-driver-nfs.
  - path: /lethe/k8s
    clients: 10.0.20.0/24
    options: rw,sync,no_subtree_check,no_root_squash
  # crossmnt shows the child dataset lethe/data/media/transcode.
  - path: /lethe/data/media
    clients: 10.0.20.0/24
    options: rw,sync,no_subtree_check,no_root_squash,crossmnt

# mnemosyne mounts /lethe/shares with virtiofs. The user of the OpenTofu token
# for pantheon attaches the mapping to the VM. Do not export the folder with
# NFS: OpenCloud on mnemosyne sees only the changes that go through
# mnemosyne.
proxmox_dir_mapping_folders:
  - mapping: lethe-shares
    path: /lethe/shares
proxmox_dir_mapping_users:
  - tofu@pve

# gaia routes the typhon VLAN for the devices on the tailnet. The Headscale
# policy approves the route. tag:github-actions gets no access to it.
tailscale_advertise_routes:
  - 10.0.20.0/24
