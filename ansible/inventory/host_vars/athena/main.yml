---
# The VM of the Hermes agent on tartarus. caleb runs Hermes, and the agent
# runs its commands in a Docker sandbox. secrets.sops.yml holds
# dev_tools_opencode_auth, hermes_agent_env, and hermes_agent_soul, the
# identity of the agent in ~/.hermes/SOUL.md.

ssh_hardening_allow_users:
  - caleb
  - iac-admin

# The policy gives tag:agent no grant as a source, so the agent cannot open a
# connection to a different node of the tailnet.
tailscale_login_server: https://vpn.buildwithcaleb.com
tailscale_tags:
  - tag:agent

# Hermes starts the sandbox containers as caleb.
docker_users:
  - caleb

# The shell of the owner and opencode, the same as on daedalus.
owner_user_shell: /usr/bin/zsh
dev_tools_user: caleb
dev_tools_apt_packages:
  - curl
  - git
  - htop
  - jq
  - ripgrep
  - tmux
  - unzip
  - zsh
dev_tools_mise_tools:
  neovim: latest
  starship: latest
  zoxide: latest
dev_tools_zsh: true
dev_tools_ghostty_terminfo: true
dev_tools_opencode: true

hermes_agent_user: caleb

# The sandbox of the agent. Each command, each execute_code run, and each file
# tool runs in one Docker container, with all capabilities dropped. The VM has
# 4 vCPU and 8 GiB, so the gateway keeps 2 vCPU and 4 GiB.
#
# opencode in the sandbox is the opencode of caleb on the VM, read-only, so
# it updates with each run of dev_tools. Hermes runs each command in a login
# shell, and /etc/profile of the image sets PATH again. /usr/local/sbin is on
# that PATH and empty in the image, so opencode goes there. The opencode skill
# of Hermes also looks in ~/.opencode/bin. opencode reads OPENCODE_API_KEY for
# Zen and Go. Code in the sandbox can read this key.
hermes_agent_config:
  terminal:
    backend: docker
    docker_image: nousresearch/hermes-sandbox:desktop
    container_cpu: 2
    container_memory: 4096
    docker_volumes:
      - /home/caleb/.opencode/bin:/usr/local/sbin:ro
      - /home/caleb/.opencode/bin:/root/.opencode/bin:ro
    # The PATH of a shell that is not a login shell.
    docker_env:
      PATH: /root/.opencode/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    docker_forward_env:
      - OPENCODE_API_KEY

# The plugins from Git. See the role hermes_agent. Photon ships with Hermes,
# so it needs no entry here.
hermes_agent_plugins: []
