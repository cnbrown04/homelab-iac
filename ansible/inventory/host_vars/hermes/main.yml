---
# The pipeline logs in as iac-admin with this key.
admin_user_extra_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBJ20dWgJFxvs+kNgHVrRNqLvmMbekLjQoi5U/yzzJHZ github-actions hermes"

# The SSH settings are the defaults of the ssh_hardening role, the same as
# scripts/vps-harden.sh. Only these users can log in.
ssh_hardening_allow_users:
  - caleb
  - iac-admin

# The firewall. Docker publishes the ports of Gerbil (UDP 51820, UDP 21820,
# and UDP 443) with its own iptables rules, so they are not here. The headscale
# role adds the rule for the Pangolin network.
ufw_rules:
  - {rule: allow, port: "22", proto: tcp}
  - {rule: allow, port: "80", proto: tcp}
  - {rule: allow, port: "443", proto: tcp}

# The stack roles and stacks.yml share these values.
compose_stack_root: /opt/stacks

hermes_compose_stacks: []
hermes_compose_stack_environment: {}

# Pangolin. secrets.sops.yml holds pangolin_server_secret.
pangolin_base_domain: buildwithcaleb.com
pangolin_dashboard_domain: pangolin.buildwithcaleb.com
pangolin_acme_email: ""
pangolin_network_subnet: 10.200.0.0/24
pangolin_network_gateway: 10.200.0.1

# The Pangolin organization and the local site. Copy each value from the
# Pangolin dashboard. secrets.sops.yml holds pangolin_blueprint_api_key.
pangolin_blueprint_org_id: pantheon-homelab
pangolin_local_site: hermes-local
# The basic WireGuard site of the typhon cluster. Its peer sends port 80 of
# the tunnel address to the Gateway of the cluster. See AGENTS.md.
pangolin_typhon_site: typhon-cluster
pangolin_typhon_target: 100.89.128.4
# The Newt site in Home Assistant OS on atlas. Newt runs as an add-on. The
# address of the hassio network gateway reaches Home Assistant on port 80.
pangolin_home_assistant_site: home-assistant
pangolin_home_assistant_target: 172.30.32.1

# Pangolin resources. Headscale is not here: a Pangolin resource sends each
# request through the Pangolin app, and Headscale must not depend on it.
pangolin_blueprint_resources:
  public-resources:
    # Audiobookshelf has its own login. Its mobile apps cannot pass the
    # Pangolin login, so SSO is off.
    audiobookshelf:
      name: Audiobookshelf
      mode: http
      full-domain: audiobooks.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    glance:
      name: Glance
      mode: http
      full-domain: home.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Jellyfin has its own login. Its apps cannot pass the Pangolin login, so
    # SSO is off.
    jellyfin:
      name: Jellyfin
      mode: http
      full-domain: jellyfin.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Sonarr has no login of its own. Keep SSO on. Ruddarr cannot pass the
    # Pangolin login, so it uses basic auth. The API still needs the API key.
    sonarr:
      name: Sonarr
      mode: http
      full-domain: sonarr.buildwithcaleb.com
      auth:
        sso-enabled: true
        basic-auth:
          user: "{{ ruddarr_basic_auth_user }}"
          password: "{{ ruddarr_basic_auth_password }}"
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Radarr has no login of its own. Keep SSO on. Ruddarr cannot pass the
    # Pangolin login, so it uses basic auth. The API still needs the API key.
    radarr:
      name: Radarr
      mode: http
      full-domain: radarr.buildwithcaleb.com
      auth:
        sso-enabled: true
        basic-auth:
          user: "{{ ruddarr_basic_auth_user }}"
          password: "{{ ruddarr_basic_auth_password }}"
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Prowlarr has no login of its own. Keep SSO on.
    prowlarr:
      name: Prowlarr
      mode: http
      full-domain: prowlarr.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Chaptarr has no login of its own. Keep SSO on.
    chaptarr:
      name: Chaptarr
      mode: http
      full-domain: chaptarr.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    qbittorrent:
      name: qBittorrent
      mode: http
      full-domain: qbittorrent.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    jackett:
      name: Jackett
      mode: http
      full-domain: jackett.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Seerr users log in with their Jellyfin accounts, so SSO is off.
    seerr:
      name: Seerr
      mode: http
      full-domain: seerr.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # FileBrowser has its own login through Pocket ID. Its WebDAV clients
    # cannot pass the Pangolin login, so SSO is off.
    filebrowser:
      name: FileBrowser
      mode: http
      full-domain: files.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Termix logs in with Pocket ID, but it opens SSH to the hosts. Keep SSO
    # on, also because the first user to register gets the admin role.
    termix:
      name: Termix
      mode: http
      full-domain: termix.buildwithcaleb.com
      auth:
        sso-enabled: true
      targets:
        - site: "{{ pangolin_typhon_site }}"
          method: http
          hostname: "{{ pangolin_typhon_target }}"
          port: 80
    # Home Assistant has its own login. Its mobile app cannot pass the Pangolin
    # login, so SSO is off.
    home-assistant:
      name: Home Assistant
      mode: http
      full-domain: homeassistant.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_home_assistant_site }}"
          method: http
          hostname: "{{ pangolin_home_assistant_target }}"
          port: 80
    # Bambuddy runs as an app in Home Assistant OS, with the host network on
    # port 8000. It has no Pangolin login. It logs in with OIDC through Pocket
    # ID itself.
    bambuddy:
      name: Bambuddy
      mode: http
      full-domain: bambuddy.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_home_assistant_site }}"
          method: http
          hostname: "{{ pangolin_home_assistant_target }}"
          port: 8000
    # Headplane has no Pangolin login. It logs in with Pocket ID itself.
    headplane:
      name: Headplane
      mode: http
      full-domain: headplane.buildwithcaleb.com
      auth:
        sso-enabled: false
      targets:
        - site: "{{ pangolin_local_site }}"
          method: http
          hostname: headplane
          port: 3000
    # Dockge has no health route. The Dockge server makes robots.txt itself,
    # so a public robots.txt shows that Dockge runs. Glance tests it.
    dockge:
      name: Dockge
      mode: http
      full-domain: dockge.buildwithcaleb.com
      auth:
        sso-enabled: true
      rules:
        - action: allow
          match: path
          value: /robots.txt
      targets:
        - site: "{{ pangolin_local_site }}"
          method: http
          hostname: dockge
          port: 5001
    pocket-id:
      name: Pocket ID
      mode: http
      full-domain: auth.buildwithcaleb.com
      auth:
        sso-enabled: "{{ pocket_id_setup_mode | bool }}"
      targets:
        - site: "{{ pangolin_local_site }}"
          method: http
          hostname: pocket-id
          port: 1411

headplane_base_url: https://headplane.buildwithcaleb.com
# Log in to Headplane with Pocket ID. Headplane and Headscale share the Pocket
# ID client "VPN". secrets.sops.yml holds its ID and secret.
headplane_oidc_issuer: "{{ pocket_id_app_url }}"
headplane_oidc_client_id: "{{ vpn_oidc_client_id }}"
headplane_oidc_client_secret: "{{ vpn_oidc_client_secret }}"

# Pocket ID is the SSO provider. It is always a Pangolin resource. The first
# person who opens its setup page becomes the admin, so the Pangolin login
# protects it during the setup. After you make the admin, set this to false:
# OIDC clients call Pocket ID from their servers, with no Pangolin session.
pocket_id_setup_mode: false
pocket_id_app_url: https://auth.buildwithcaleb.com
pocket_id_trusted_proxies:
  - "{{ pangolin_network_subnet }}"

# Headplane serves only /admin. Traefik sends the root path there.
pangolin_root_redirects:
  - host: headplane.buildwithcaleb.com
    path: /admin/

# Headscale. Traefik in the Pangolin stack sends vpn.buildwithcaleb.com to the
# listener on the gateway of the Pangolin network.
# renovate: datasource=github-releases depName=juanfont/headscale extractVersion=^v(?<version>.+)$
headscale_version: 0.29.4
headscale_server_url: https://vpn.buildwithcaleb.com
headscale_listen_port: 8085
headscale_listen_addr: "{{ pangolin_network_gateway }}:{{ headscale_listen_port }}"
headscale_trusted_proxies:
  - "{{ pangolin_network_subnet }}"
# Personal devices log in with Pocket ID, so no local user is necessary. A
# Pocket ID login makes its own Headscale user. The client is "VPN", the same
# client as Headplane.
headscale_users: []
headscale_oidc_issuer: "{{ pocket_id_app_url }}"
headscale_oidc_client_id: "{{ vpn_oidc_client_id }}"
headscale_oidc_client_secret: "{{ vpn_oidc_client_secret }}"
# Each node gets the name <node>.vnet.buildwithcaleb.com. The owner chose
# this on 27 September 2026.
headscale_magic_dns: true
headscale_base_domain: vnet.buildwithcaleb.com

# The daily backup to R2. secrets.sops.yml holds the endpoint, the R2 keys,
# and the restic password.
backup_r2_bucket: homelab-hermes-backup
backup_paths:
  - /var/lib/headscale
  - /etc/headscale
  - /opt/stacks/pangolin/config
  - /opt/stacks/headplane
  - /opt/dockge/data
  - /opt/stacks/pocket-id/data
backup_excludes:
  - /opt/stacks/pangolin/config/traefik/logs
