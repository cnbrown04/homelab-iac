---
# The file server. It shares the dataset lethe/shares of gaia, through the
# directory mapping lethe-shares. Samba and OpenCloud use the same folders.
# OpenCloud is at files.buildwithcaleb.com.

# Only the admin user logs in with SSH.
ssh_hardening_allow_users:
  - caleb
  - iac-admin

# The devices on the tailnet reach the shares at
# mnemosyne.vnet.buildwithcaleb.com.
tailscale_login_server: https://vpn.buildwithcaleb.com
tailscale_tags:
  - tag:nas

samba_virtiofs_tag: lethe-shares
# One share for each user. Use the Pocket ID user name: the share is the
# folder users/<name>, and OpenCloud makes it at the first login of the user.
# secrets.sops.yml holds samba_user_passwords.
samba_users:
  - caleb

# The web, desktop, and mobile apps of OpenCloud use one Pocket ID client: a
# public client with PKCE and the custom client ID opencloud. Its callback
# URLs are https://files.buildwithcaleb.com/,
# https://files.buildwithcaleb.com/oidc-callback.html,
# https://files.buildwithcaleb.com/oidc-silent-redirect.html,
# http://127.0.0.1, http://localhost, oc://android.opencloud.eu, and
# oc://ios.opencloud.eu.
opencloud_url: https://files.buildwithcaleb.com
opencloud_oidc_issuer: https://auth.buildwithcaleb.com

# The Newt site mnemosyne in Pangolin. secrets.sops.yml holds newt_secret.
newt_id: 55nffwaowymropt
