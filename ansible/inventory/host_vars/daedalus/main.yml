---
# The development VM on tartarus. To add or delete a tool, change the lists in
# this file, then run ansible/playbooks/daedalus.yml.

# The owner logs in as this user. Ansible logs in as iac-admin.
dev_tools_user: caleb
owner_user_shell: /usr/bin/zsh
docker_users:
  - caleb

ssh_hardening_allow_users:
  - iac-admin
  - caleb

# The defaults of ssh_hardening, with three changes for development. VS Code
# Remote-SSH needs TCP forwarding. Agent forwarding lets git use the key of
# the laptop. VS Code opens more than 4 sessions.
ssh_hardening_options:
  Port: "22"
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  ChallengeResponseAuthentication: "no"
  PubkeyAuthentication: "yes"
  PermitEmptyPasswords: "no"
  AuthenticationMethods: "publickey"
  MaxAuthTries: "3"
  MaxSessions: "10"
  LoginGraceTime: "30"
  X11Forwarding: "no"
  AllowAgentForwarding: "yes"
  AllowTcpForwarding: "yes"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "2"

# The devices on the tailnet reach the VM at daedalus.vnet.buildwithcaleb.com.
tailscale_login_server: https://vpn.buildwithcaleb.com
tailscale_tags:
  - tag:dev

# The system packages. The docker role installs Docker.
dev_tools_apt_packages:
  - build-essential
  - curl
  - fd-find
  - git
  - htop
  - jq
  - libssl-dev
  - pkg-config
  - ripgrep
  - tmux
  - unzip
  - wget
  - zsh

# APT deletes these packages. Put a package here when you delete it from the
# list above.
dev_tools_apt_absent: []

# mise installs these tools for caleb. A tool that you delete here goes away
# on the next run. "latest" installs the newest version one time. Run
# "mise upgrade" on the VM to get a newer version.
dev_tools_mise_tools:
  bun: latest
  fzf: latest
  gh: latest
  go: latest
  lazygit: latest
  neovim: latest
  node: lts
  rust: stable
  starship: latest
  uv: latest
  zoxide: latest
  # The language servers of the neovim config.
  lua-language-server: latest
  "npm:pyright": latest
  "npm:typescript": latest
  "npm:typescript-language-server": latest
  "npm:vscode-langservers-extracted": latest
  rust-analyzer: latest

# The merge commit of the device flow of opkssh (pull request 521). The
# release v0.17.0 does not have it. Delete this line when a release of opkssh
# has the device flow, and set OPKSSH_DEVICE_FLOW on the host some other way.
dev_tools_opkssh_source_ref: 74edb0a5eeb0429b7257f4473947309f43bb09b2

# Claude Code and opencode use their own installers, so they stay on the
# newest version. Each run of the playbook also updates them.
dev_tools_claude_code: true
dev_tools_opencode: true

# The shell of the desktop of the owner: zsh with Zap, starship, and zoxide.
dev_tools_zsh: true
dev_tools_ghostty_terminfo: true

# The neovim and tmux configs of the desktop, from roles/dev_tools/files/dotfiles.
dev_tools_nvim_config: true
dev_tools_tmux_config: true
