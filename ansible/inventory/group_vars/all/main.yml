---
ansible_become: true
# Each host runs Debian or Ubuntu with /usr/bin/python3. A fixed path saves the
# discovery call of each host.
ansible_python_interpreter: /usr/bin/python3

common_base_packages:
  - ca-certificates
  - sudo
  - python3-debian

# Ansible logs in to each host as the admin user, with sudo and no password.
# The admin_user role makes the user. No person logs in with it.
ansible_user: iac-admin
admin_user_name: iac-admin
# The pipeline key of hermes is in host_vars/hermes.
admin_user_extra_ssh_keys: []

# Ansible logs in with the opkssh key of mise run login, and offers no other
# key. The pipeline sets HOMELAB_SSH_KEY_FILE to its own key. Without
# IdentitiesOnly, the agent offers its keys first and uses up MaxAuthTries.
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOMELAB_SSH_KEY_FILE', default='~/.ssh/opkssh_homelab') }}"
ansible_ssh_common_args: -o IdentitiesOnly=yes

# The owner logs in as this user, with sudo. iac-admin is for Ansible and the
# pipelines only. secrets.sops.yml holds owner_user_password_hash.
owner_user_name: caleb
owner_user_ssh_keys_url: https://github.com/cnbrown04.keys

# opkssh: a login with a 24-hour SSH certificate from Pocket ID. Members of
# the Pocket ID group homelab_admin log in as the owner and as iac-admin.
opkssh_issuer: https://auth.buildwithcaleb.com
# The client ID of the Pocket ID client "opkssh". It is not a secret.
opkssh_client_ids:
  - opkssh
opkssh_policy:
  - {principal: caleb, identity: "oidc:groups:homelab_admin"}
  - {principal: iac-admin, identity: "oidc:groups:homelab_admin"}
