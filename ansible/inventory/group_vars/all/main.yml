---
ansible_become: true
ansible_python_interpreter: auto_silent

common_base_packages:
  - ca-certificates
  - sudo
  - python3-debian

# Ansible logs in to each host as the admin user and uses sudo. The admin_user
# role makes the user. secrets.sops.yml holds admin_user_password_hash. Use the
# same password on each host, because -K gives one password to all hosts.
ansible_user: iac-admin
admin_user_name: iac-admin
admin_user_ssh_keys_url: https://github.com/cnbrown04.keys
# Public keys in addition to the keys at the URL. The pipeline key is here.
admin_user_extra_ssh_keys: []
