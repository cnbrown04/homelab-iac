---
ansible_become: true
# Each host runs Debian or Ubuntu with /usr/bin/python3. A fixed path saves the
# discovery call of each host.
ansible_python_interpreter: /usr/bin/python3

common_base_packages:
  - ca-certificates
  - sudo
  - python3-debian

# Ansible logs in to each host as the admin user, with sudo and no password.
# The admin_user role makes the user. No person logs in with it.
ansible_user: iac-admin
admin_user_name: iac-admin

# The networks that the keys of iac-admin and Termix work from: the LAN and
# the tailnet. host_vars/hermes changes the list.
ssh_key_sources:
  - 10.0.1.0/24
  - 100.64.0.0/10

# The key of iac-admin. Its private key is in 1Password, and only the agent
# uses it. The key does not log in from other networks.
admin_user_ssh_keys:
  - 'from="{{ ssh_key_sources | join(",") }}" {{ lookup("ansible.builtin.file", inventory_dir ~ "/../iac-admin-key.pub") }}'
# The pipeline key of hermes is in host_vars/hermes.
admin_user_extra_ssh_keys: []

# Ansible logs in with the key in iac-admin-key.pub. SSH gets the private key
# from the agent, for example 1Password. The pipeline sets
# HOMELAB_SSH_KEY_FILE to its own key. Without IdentitiesOnly, the agent
# offers its keys first and uses up MaxAuthTries.
#
# cloud-init gives iac-admin of a new VM the key in cloud-init-key.pub, so SSH
# offers it second. The first run deletes the key on the VM.
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOMELAB_SSH_KEY_FILE', default=inventory_dir ~ '/../iac-admin-key.pub') }}"
ansible_ssh_common_args: >-
  -o IdentitiesOnly=yes
  -o IdentityFile={{ inventory_dir }}/../cloud-init-key.pub

# The owner logs in as this user, with sudo. iac-admin is for Ansible and the
# pipelines only. secrets.sops.yml holds owner_user_password_hash.
owner_user_name: caleb
owner_user_ssh_keys_url: https://github.com/cnbrown04.keys
# The key of Termix logs in as the owner only, from ssh_key_sources.
owner_user_extra_ssh_keys:
  - 'from="{{ ssh_key_sources | join(",") }}" {{ lookup("ansible.builtin.file", inventory_dir ~ "/../termix-key.pub") }}'
# The role drops these keys and the extra keys from the keys at the URL. So a
# copy on GitHub does not let the key of iac-admin log in as the owner, and
# does not remove the network limit of the key of Termix.
owner_user_refused_ssh_keys: "{{ admin_user_ssh_keys }}"

# opkssh: a login with a 24-hour SSH certificate from Pocket ID. Members of
# the Pocket ID group homelab_admin log in as the owner and as iac-admin.
opkssh_issuer: https://auth.buildwithcaleb.com
# The client ID of the Pocket ID client "opkssh". It is not a secret.
opkssh_client_ids:
  - opkssh
opkssh_policy:
  - {principal: caleb, identity: "oidc:groups:homelab_admin"}
  - {principal: iac-admin, identity: "oidc:groups:homelab_admin"}
