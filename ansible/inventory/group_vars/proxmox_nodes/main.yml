---
# The admin user is in group_vars/all. The first run on a new node uses root.
# See playbooks/proxmox_bootstrap.yml.

tailscale_login_server: https://vpn.buildwithcaleb.com
tailscale_tags:
  - tag:proxmox

# The cluster uses root SSH between its nodes, with keys. So root keeps key
# login, and no AllowUsers list limits the users. The owner chose this on
# 28 September 2026.
ssh_hardening_options:
  PermitRootLogin: "prohibit-password"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  PubkeyAuthentication: "yes"
  PermitEmptyPasswords: "no"

# Only the security updates of Debian upgrade by themselves. Proxmox packages
# never do.
unattended_upgrades_debian_security_only: true

# The web UI at https://<node>.vnet.buildwithcaleb.com, with a Let's Encrypt
# certificate and the Pocket ID login. secrets.sops.yml holds the Cloudflare
# token and the OIDC client. The owner chose these on 28 September 2026.
proxmox_web_base_domain: vnet.buildwithcaleb.com
proxmox_web_acme_email: caleb@auburn.edu
proxmox_web_cloudflare_token: "{{ proxmox_cloudflare_dns_token }}"
proxmox_web_oidc_issuer: https://auth.buildwithcaleb.com
proxmox_web_oidc_client_id: "{{ proxmox_oidc_client_id }}"
proxmox_web_oidc_client_secret: "{{ proxmox_oidc_client_secret }}"

# The weekly check for a necessary reboot, on Wednesday night. The VMs and
# hermes do their check on Sunday night. The nodes go in turn, and gaia goes
# last, because it holds the NFS storage and the control plane of typhon. The
# VMs on a node stop with the node. See the role reboot_if_needed.
reboot_if_needed_times:
  tartarus: "03:00"
  theia: "03:20"
  atlas: "03:40"
  hyperion: "04:00"
  gaia: "04:30"
reboot_if_needed_proxmox_kernel: true
reboot_if_needed_calendar: "Wed *-*-* {{ reboot_if_needed_times[inventory_hostname] }}:00 America/Chicago"
