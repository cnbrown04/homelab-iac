name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-1.23.0
    container_name: pangolin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    volumes:
      - ./config:/app/config
      # The login page shows this logo for each OIDC provider.
      - ./config/branding/pocketid.png:/app/public/idp/openid.png:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.5.2
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 443:443/udp
      - 80:80

  traefik:
    image: docker.io/traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    # Traefik uses the network of Gerbil, so Gerbil publishes its ports.
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik

# The subnet is fixed. Headscale listens on the gateway address, and Traefik
# gets to Headscale through that address.
networks:
  default:
    driver: bridge
    name: pangolin
    ipam:
      config:
        - subnet: "${PANGOLIN_NETWORK_SUBNET}"
          gateway: "${PANGOLIN_NETWORK_GATEWAY}"
