---
- name: Check the Wazuh host
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] | lower == "ubuntu"
      - wazuh_enrollment_password | default('') | length > 0
      - wazuh_server_oidc_client_id | length > 0
      - wazuh_server_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      The host must run Ubuntu. Set wazuh_enrollment_password and
      wazuh_server_oidc_client_secret in SOPS, and wazuh_server_oidc_client_id.

- name: Create the folder of the installation assistant
  ansible.builtin.file:
    path: "{{ wazuh_server_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download the installation assistant
  ansible.builtin.get_url:
    url: "{{ wazuh_server_install_script_url }}"
    dest: "{{ wazuh_server_install_dir }}/wazuh-install.sh"
    checksum: "{{ wazuh_server_install_script_checksum }}"
    owner: root
    group: root
    mode: "0700"

# The assistant installs the indexer, the manager, Filebeat, and the
# dashboard, and makes the certificates and the passwords. It runs one time.
# The tar file shows that it completed.
- name: Install Wazuh with the installation assistant
  ansible.builtin.command:
    cmd: bash ./wazuh-install.sh --all-in-one
    chdir: "{{ wazuh_server_install_dir }}"
    creates: "{{ wazuh_server_install_dir }}/wazuh-install-files.tar"
  # The install takes about 10 minutes.
  async: 3600
  poll: 30

# A check run does not install the packages. The tasks below need them.
- name: Read the installed packages
  ansible.builtin.package_facts:
  check_mode: false

- name: Configure the installed Wazuh
  when: wazuh_server_packages | difference(ansible_facts.packages.keys()) | length == 0
  block:
    - name: Hold the Wazuh packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ wazuh_server_packages }}"

    # The assistant calculates a heap of 1 GiB on Ubuntu 24.04, because of a
    # defect in the script. Set the heap here.
    - name: Set the JVM heap of the indexer
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/jvm.options
        regexp: "^{{ item }}"
        line: "{{ item }}{{ wazuh_server_indexer_heap }}"
      loop: [-Xms, -Xmx]
      notify: Restart the Wazuh indexer

    # An agent must give this password to enroll.
    - name: Write the enrollment password
      ansible.builtin.copy:
        content: "{{ wazuh_enrollment_password }}\n"
        dest: /var/ossec/etc/authd.pass
        owner: root
        group: wazuh
        mode: "0640"
      no_log: true
      notify: Restart the Wazuh manager

    - name: Ask each agent for the enrollment password
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: "<use_password>no</use_password>"
        replace: "<use_password>yes</use_password>"
      notify: Restart the Wazuh manager

    # The indexer accepts a Pocket ID token. The handler loads each changed
    # file into the indexer.
    - name: Write the authentication settings of the indexer
      ansible.builtin.template:
        src: opensearch-security-config.yml.j2
        dest: /etc/wazuh-indexer/opensearch-security/config.yml
        owner: wazuh-indexer
        group: wazuh-indexer
        mode: "0640"
      notify: Load the authentication settings

    - name: Give all_access to the admin group of Pocket ID
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/opensearch-security/roles_mapping.yml
        insertafter: '^  - "admin"$'
        line: '  - "{{ wazuh_server_oidc_admin_group }}"'
      notify: Load the role mapping

    - name: Set the login of the dashboard
      ansible.builtin.lineinfile:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
        regexp: "^{{ item.key | regex_escape }}:"
        line: "{{ item.key }}: {{ item.value }}"
      loop: "{{ wazuh_server_dashboard_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      notify: Restart the Wazuh dashboard
      vars:
        wazuh_server_dashboard_settings:
          opensearch_security.auth.multiple_auth_enabled: "true"
          opensearch_security.auth.type: '["basicauth","openid"]'
          opensearch_security.openid.connect_url: >-
            "{{ wazuh_server_oidc_issuer }}/.well-known/openid-configuration"
          opensearch_security.openid.client_id: '"{{ wazuh_server_oidc_client_id }}"'
          opensearch_security.openid.client_secret: '"{{ wazuh_server_oidc_client_secret }}"'
          opensearch_security.openid.scope: '"openid profile email groups"'
          opensearch_security.openid.base_redirect_url: '"{{ wazuh_server_public_url }}"'
          opensearch_security.ui.openid.login.buttonname: '"Log in with Pocket ID"'

    # Each user of the dashboard calls the API of the manager as wazuh-wui.
    # Only the admin group can log in, so a per-user role in the API gives
    # nothing.
    - name: Call the API as the user of the dashboard
      ansible.builtin.replace:
        path: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        regexp: "^(\\s+)run_as: true$"
        replace: "\\1run_as: false"
      notify: Restart the Wazuh dashboard

    - name: Start and enable the Wazuh services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - wazuh-indexer
        - wazuh-manager
        - filebeat
        - wazuh-dashboard
