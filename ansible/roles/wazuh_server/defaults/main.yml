---
# The version of each part of Wazuh. The agents use the same version, and an
# agent must not be newer than the manager. See the role wazuh_agent.
wazuh_server_version: 4.14.8
# The installation assistant of this version, and its SHA-256.
wazuh_server_install_script_url: https://packages.wazuh.com/4.14/wazuh-install.sh
wazuh_server_install_script_checksum: sha256:9adb693c474317644358fef74e629b0fab782bcb9c1a411e967a8348e3830bc1
# The folder of the assistant. It writes wazuh-install-files.tar here, with
# the passwords of the indexer users and of the API.
wazuh_server_install_dir: /root/wazuh

# The JVM heap of the indexer. On 1 November 2026 the indexer used 620 MiB of
# a 4 GiB heap, with less than 100 MiB of indices. 2 GiB keeps 3 times that.
# Raise it if the heap goes above 75%: see _cat/nodes in the dashboard.
wazuh_server_indexer_heap: 2g

# The packages that the assistant installs. APT holds them, so an unattended
# upgrade does not change the version.
wazuh_server_packages:
  - wazuh-indexer
  - wazuh-manager
  - wazuh-dashboard
  - filebeat

# The public URL of the dashboard. Pangolin sends it to the Newt site on
# argus. The login with Pocket ID returns to this URL.
wazuh_server_public_url: https://wazuh.buildwithcaleb.com
# The Pocket ID client of the dashboard. Its callback URL is
# <wazuh_server_public_url>/auth/openid/login. secrets.sops.yml holds
# wazuh_server_oidc_client_secret.
wazuh_server_oidc_issuer: https://auth.buildwithcaleb.com
wazuh_server_oidc_client_id: ""
# The members of this Pocket ID group get the role all_access.
wazuh_server_oidc_admin_group: homelab_admin
