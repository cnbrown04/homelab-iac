---
- name: Check the Headscale settings
  ansible.builtin.assert:
    that:
      - headscale_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - headscale_server_url is match('^https://')
      - headscale_listen_addr | length > 0
      - ansible_distribution | lower in ["debian", "ubuntu"]
      - ansible_distribution_release | length > 0
      - ansible_architecture in headscale_architecture_map
    fail_msg: >-
      Set a supported OS, CPU architecture, pinned Headscale version, HTTPS
      server URL, and private listener before you deploy Headscale.

- name: Set the Headscale package architecture
  ansible.builtin.set_fact:
    headscale_package_architecture: "{{ headscale_architecture_map[ansible_architecture] }}"
    headscale_release_url: >-
      https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}
    headscale_listen_ip: "{{ headscale_listen_addr | regex_replace(':[0-9]+$', '') }}"
    headscale_listen_port_number: "{{ headscale_listen_addr | regex_search('[0-9]+$') }}"

# Headscale cannot bind to an address that does not exist. The Pangolin role
# creates the Docker network that owns the address.
- name: Check that the listener address exists on the host
  ansible.builtin.assert:
    that:
      - headscale_listen_ip is match('^127[.]') or headscale_listen_ip in ansible_all_ipv4_addresses
    fail_msg: >-
      The address {{ headscale_listen_ip }} is not on this host. Deploy the
      Pangolin stack before Headscale.

- name: Download the pinned Headscale package
  ansible.builtin.get_url:
    url: "{{ headscale_release_url }}/headscale_{{ headscale_version }}_linux_{{ headscale_package_architecture }}.deb"
    dest: "/tmp/headscale_{{ headscale_version }}_linux_{{ headscale_package_architecture }}.deb"
    owner: root
    group: root
    mode: "0644"

- name: Install Headscale
  ansible.builtin.apt:
    deb: "/tmp/headscale_{{ headscale_version }}_linux_{{ headscale_package_architecture }}.deb"
    state: present

- name: Create the directory for the Headscale unit override
  ansible.builtin.file:
    path: /etc/systemd/system/headscale.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Docker creates the network address at start. Headscale starts after it.
- name: Start Headscale after Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/headscale.service.d/10-after-docker.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=docker.service
      Wants=docker.service
  notify:
    - Reload systemd
    - Restart Headscale

- name: Let the reverse proxy reach the Headscale listener
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ headscale_proxy_subnet }}"
    to_ip: "{{ headscale_listen_ip }}"
    to_port: "{{ headscale_listen_port_number }}"
    comment: Pangolin to Headscale
  when: headscale_proxy_subnet | length > 0

- name: Install the Headscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/headscale/config.yaml
    owner: root
    group: headscale
    mode: "0640"
  notify: Restart Headscale

- name: Install the Headscale policy
  ansible.builtin.copy:
    src: acl.hujson
    dest: "{{ headscale_acl_path }}"
    owner: root
    group: headscale
    mode: "0640"
  notify: Reload Headscale

- name: Validate the Headscale configuration
  ansible.builtin.command:
    cmd: headscale configtest
  changed_when: false

- name: Start and enable Headscale
  ansible.builtin.systemd_service:
    name: headscale
    enabled: true
    state: started

- name: Read the Headscale users
  ansible.builtin.command:
    cmd: headscale users list -o json
  register: headscale_user_list
  changed_when: false

# Headscale returns null when no user exists.
- name: Create each Headscale user
  ansible.builtin.command:
    cmd: "headscale users create {{ item }}"
  loop: "{{ headscale_users | difference(headscale_user_list.stdout | from_json | default([], true) | map(attribute='name')) }}"
  changed_when: true
