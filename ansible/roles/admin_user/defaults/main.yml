---
# The account of Ansible and the pipelines. No person logs in with it. It
# logs in with a key, and it has sudo with no password. Its password is locked.
admin_user_name: ""
# Public keys of the account, one line each, with options such as from="...".
admin_user_ssh_keys: []
# More keys, for example the key of a pipeline. The keys of the two lists
# replace all other keys in authorized_keys.
admin_user_extra_ssh_keys: []
