---
# The account of Ansible and the pipelines. No person logs in with it. It
# logs in with opkssh, or with a key in admin_user_extra_ssh_keys, and it has
# sudo with no password. Its password is locked.
admin_user_name: ""
# Public keys of the account, for example the key of a pipeline. These keys
# replace all other keys in authorized_keys.
admin_user_extra_ssh_keys: []
