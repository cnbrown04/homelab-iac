---
- name: Check the admin user settings
  ansible.builtin.assert:
    that:
      - admin_user_name is match('^[a-z_][a-z0-9_-]*$')
      - (admin_user_ssh_keys + admin_user_extra_ssh_keys) | length > 0
    fail_msg: >-
      Set the name of the admin user, and at least one key. With no key,
      Ansible cannot log in again.

- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

# The rule comes before the lock of the password, so sudo keeps working for
# the rest of this run. visudo checks the file before it goes in place.
- name: Let the admin user use sudo with no password
  ansible.builtin.copy:
    content: |
      # Ansible writes this file. See the role admin_user.
      {{ admin_user_name }} ALL=(ALL:ALL) NOPASSWD: ALL
    dest: "/etc/sudoers.d/{{ admin_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# "!" locks the password. A key still logs in.
- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user_name }}"
    groups: [sudo]
    append: true
    shell: /bin/bash
    password: "!"
    update_password: always

- name: Create the SSH folder of the admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user_name }}/.ssh"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0700"

# These keys replace all other keys.
- name: Set the SSH keys of the admin user
  ansible.builtin.copy:
    content: "{{ (admin_user_ssh_keys + admin_user_extra_ssh_keys) | join('\n') ~ '\n' }}"
    dest: "/home/{{ admin_user_name }}/.ssh/authorized_keys"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0600"
