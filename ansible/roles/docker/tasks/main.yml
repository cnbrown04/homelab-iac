---
- name: Check Docker host support
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution | lower in ["debian", "ubuntu"]
      - ansible_distribution_release | length > 0
      - ansible_architecture in docker_apt_architecture_map
    fail_msg: "The host OS or CPU architecture is not supported by this role."

- name: Set the Docker repository architecture
  ansible.builtin.set_fact:
    docker_repository_architecture: "{{ docker_apt_architecture_map[ansible_architecture] }}"

- name: Create the APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Docker APT signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: "{{ docker_repository_architecture }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Refresh the APT package index for Docker
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
