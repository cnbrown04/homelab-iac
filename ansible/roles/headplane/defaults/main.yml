---
headplane_stack_root: /opt/stacks
headplane_cookie_secret: ""
# Headplane uses this URL for the Headscale API.
headplane_headscale_url: "http://{{ headscale_listen_addr | default('') }}"
# The public URL of Headscale. Headplane shows it in the UI.
