---
tailscale_login_server: ""
tailscale_tags: []
# The host that runs Headscale. Ansible makes a join key on it.
tailscale_headscale_host: hermes
tailscale_extra_up_args:
  - --accept-dns=false

# The subnets that the node routes for the tailnet, for example 10.0.20.0/24.
# With a subnet, the role turns on IPv4 forwarding. The policy of Headscale
# must approve each route.
tailscale_advertise_routes: []
