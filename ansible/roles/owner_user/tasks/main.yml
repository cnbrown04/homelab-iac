---
- name: Check the owner user settings
  ansible.builtin.assert:
    that:
      - owner_user_name is match('^[a-z_][a-z0-9_-]*$')
      - owner_user_name != admin_user_name | default('')
      - owner_user_ssh_keys_url is match('^https://')
      - owner_user_password_hash is match('^\$6\$')
    fail_msg: >-
      Set a user name that is not the admin user, an HTTPS URL for the SSH
      keys, and a SHA-512 password hash in secrets.sops.yml.
  no_log: true

# On mnemosyne, the Samba role made this account first, with no login. This
# role turns it into a login account. Samba forces its own user and group for
# each file, so the primary group does not matter to Samba.
- name: Create the group of the owner user
  ansible.builtin.group:
    name: "{{ owner_user_name }}"
    state: present
  register: owner_user_group

# A check run does not create a new group, so the user module cannot set it.
- name: Create the owner user
  ansible.builtin.user:
    name: "{{ owner_user_name }}"
    group: "{{ omit if (ansible_check_mode and owner_user_group is changed) else owner_user_name }}"
    groups: "{{ owner_user_groups }}"
    append: true
    shell: "{{ owner_user_shell }}"
    home: "/home/{{ owner_user_name }}"
    create_home: true
    password: "{{ owner_user_password_hash }}"
    update_password: always
  no_log: true

- name: Read the accounts of the host
  ansible.builtin.getent:
    database: passwd
  # The task only reads, so it also runs in check mode.
  check_mode: false

# The user module does not make the folder when it only changes the home of
# an account that exists. A check run does not create the user, so the
# account can be missing.
- name: Create the home folder of the owner user
  ansible.builtin.file:
    path: "/home/{{ owner_user_name }}"
    state: directory
    owner: "{{ owner_user_name }}"
    group: "{{ owner_user_name }}"
    mode: "0750"
  when: owner_user_name in ansible_facts['getent_passwd']

- name: Read the SSH keys at the URL
  ansible.builtin.set_fact:
    owner_user_url_keys: "{{ lookup('ansible.builtin.url', owner_user_ssh_keys_url, split_lines=False) }}"

- name: Check that the URL gave at least one key
  ansible.builtin.assert:
    that:
      - owner_user_url_keys is search('^ssh-', multiline=True)
    fail_msg: "The URL {{ owner_user_ssh_keys_url }} gave no SSH key. Ansible stops, so it does not delete your keys."

- name: Set the SSH keys of the owner user
  ansible.posix.authorized_key:
    user: "{{ owner_user_name }}"
    key: "{{ owner_user_url_keys | trim }}"
    exclusive: true
    state: present
  when: owner_user_name in ansible_facts['getent_passwd']
