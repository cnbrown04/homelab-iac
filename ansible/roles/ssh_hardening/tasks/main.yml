---
- name: Check the SSH settings
  ansible.builtin.assert:
    that:
      - ssh_hardening_options is mapping
      - ssh_hardening_allow_users | length == 0 or admin_user_name | default('') in ssh_hardening_allow_users
    fail_msg: >-
      Set ssh_hardening_options. When AllowUsers limits the users, put the
      admin user in ssh_hardening_allow_users, or Ansible locks itself out.

# The host can start sshd from a socket. Then each new connection reads the
# files at once, so Ansible tests the new file before it goes in place.
- name: Write the SSH drop-in
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: SSH configuration changed
