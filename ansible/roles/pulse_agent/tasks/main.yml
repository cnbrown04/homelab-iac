---
# The owner deleted Pulse on 19 November 2026. This role deletes the Pulse
# agent and the Docker proxy from a host. After a run on each host, delete the
# role and its lines in the playbooks.
- name: Read the unit of the Pulse agent
  ansible.builtin.stat:
    path: /etc/systemd/system/pulse-agent.service
  register: pulse_agent_unit

- name: Stop and disable the Pulse agent
  ansible.builtin.systemd_service:
    name: pulse-agent.service
    state: stopped
    enabled: false
  when: pulse_agent_unit.stat.exists

- name: Read the folder of the Docker proxy stack
  ansible.builtin.stat:
    path: /opt/stacks/docker-proxy/compose.yaml
  register: pulse_agent_docker_proxy

- name: Stop the Docker proxy stack
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/docker-proxy
    state: absent
  when: pulse_agent_docker_proxy.stat.exists

- name: Delete the files of the Pulse agent and the Docker proxy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/pulse-agent.service
    - /usr/local/bin/pulse-agent
    - /etc/pulse-agent
    - /var/lib/pulse-agent
    - /etc/sudoers.d/pulse-agent
    - /usr/local/libexec/pulse-agent
    - /etc/tmpfiles.d/pulse-docker.conf
    - /run/pulse-docker
    - /opt/stacks/docker-proxy
  register: pulse_agent_files

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: pulse_agent_files is changed and not ansible_check_mode

- name: Delete the user pulse-agent
  ansible.builtin.user:
    name: pulse-agent
    state: absent
