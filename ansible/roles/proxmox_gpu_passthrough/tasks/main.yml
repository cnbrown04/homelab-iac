---
- name: Check the passthrough settings
  ansible.builtin.assert:
    that:
      - item.mapping is match('^[a-z0-9-]+$')
      - item.path is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]$')
      - item.id is match('^[0-9a-f]{4}:[0-9a-f]{4}$')
    fail_msg: "A device needs a mapping name, a PCI path, and a vendor:device ID."
    quiet: true
  loop: "{{ proxmox_gpu_passthrough_devices }}"
  loop_control:
    label: "{{ item.mapping | default('?') }}"

- name: Check the SR-IOV settings
  ansible.builtin.assert:
    that:
      - item.path is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]$')
      - item.driver is match('^[a-z0-9_]+$')
      - item.vfs is integer and item.vfs > 0
    fail_msg: "An SR-IOV device needs a PCI path, a driver, and a number of VFs."
    quiet: true
  loop: "{{ proxmox_gpu_passthrough_sriov }}"
  loop_control:
    label: "{{ item.path | default('?') }}"

- name: Load the VFIO modules at boot
  ansible.builtin.copy:
    content: |
      # Ansible writes this file. See the role proxmox_gpu_passthrough.
      vfio
      vfio_pci
      vfio_iommu_type1
    dest: /etc/modules-load.d/vfio.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update the initramfs

- name: Bind the devices to vfio-pci
  ansible.builtin.template:
    src: vfio.conf.j2
    dest: /etc/modprobe.d/vfio.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update the initramfs

# The rule takes effect at the next boot.
- name: Create the VFs at boot
  ansible.builtin.template:
    src: sriov.rules.j2
    dest: /etc/udev/rules.d/70-proxmox-gpu-sriov.rules
    owner: root
    group: root
    mode: "0644"

# A VF exists only after the PF driver creates it. Before that, the mapping
# has no IOMMU group and no subsystem ID, and the VM does not start. Run the
# role again after the reboot.
- name: Read the IOMMU group and the subsystem ID of each device
  ansible.builtin.shell:
    cmd: |
      set -eu
      d=/sys/bus/pci/devices/{{ item.path }}
      [ -e "$d/iommu_group" ] || exit 0
      printf '%s %s:%s\n' "$(basename "$(readlink "$d/iommu_group")")" \
        "$(sed 's/^0x//' "$d/subsystem_vendor")" "$(sed 's/^0x//' "$d/subsystem_device")"
  register: proxmox_gpu_passthrough_sysfs
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_gpu_passthrough_devices }}"
  loop_control:
    label: "{{ item.mapping }}"

- name: Tell the owner about a device that does not exist yet
  ansible.builtin.debug:
    msg: "{{ item.item.path }} does not exist yet. Reboot the host, then run the role again."
  loop: "{{ proxmox_gpu_passthrough_sysfs.results }}"
  loop_control:
    label: "{{ item.item.mapping }}"
  when: item.stdout | trim | length == 0

# The mappings are data of the cluster, in /etc/pve. Each node can write them.
- name: Read the PCI mappings
  ansible.builtin.command:
    cmd: pvesh get /cluster/mapping/pci --output-format json
  register: proxmox_gpu_passthrough_mappings
  changed_when: false
  check_mode: false

# Proxmox checks each property of the map when a VM starts. Without the
# subsystem ID, the VM does not start.
- name: Create the PCI mappings
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/mapping/pci
      - "--id={{ item.mapping }}"
      - "--map={{ proxmox_gpu_passthrough_map }}"
      - "--description=Ansible, the role proxmox_gpu_passthrough"
  changed_when: true
  loop: "{{ proxmox_gpu_passthrough_devices }}"
  loop_control:
    label: "{{ item.mapping }}"
  vars:
    proxmox_gpu_passthrough_map: "{{ lookup('ansible.builtin.template', 'map.j2') | trim }}"
  when: item.mapping not in (proxmox_gpu_passthrough_mappings.stdout | from_json | map(attribute='id') | list)

- name: Update the PCI mappings that differ
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/cluster/mapping/pci/{{ item.mapping }}"
      - "--map={{ proxmox_gpu_passthrough_map }}"
  changed_when: true
  loop: "{{ proxmox_gpu_passthrough_devices }}"
  loop_control:
    label: "{{ item.mapping }}"
  vars:
    proxmox_gpu_passthrough_map: "{{ lookup('ansible.builtin.template', 'map.j2') | trim }}"
    proxmox_gpu_passthrough_current: >-
      {{ proxmox_gpu_passthrough_mappings.stdout | from_json
         | selectattr('id', 'equalto', item.mapping) | list }}
  when: >-
    proxmox_gpu_passthrough_current | length > 0
    and proxmox_gpu_passthrough_current[0].map != [proxmox_gpu_passthrough_map]

- name: Read the access rules
  ansible.builtin.command:
    cmd: pveum acl list --output-format json
  register: proxmox_gpu_passthrough_acl
  changed_when: false
  check_mode: false

- name: Let the users use the mappings
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - "/mapping/pci/{{ item.0.mapping }}"
      - "--users={{ item.1 }}"
      - "--roles={{ proxmox_gpu_passthrough_role }}"
  changed_when: true
  loop: "{{ proxmox_gpu_passthrough_devices | product(proxmox_gpu_passthrough_users) | list }}"
  loop_control:
    label: "{{ item.0.mapping }} {{ item.1 }}"
  when: >-
    proxmox_gpu_passthrough_acl.stdout | from_json
    | selectattr('path', 'equalto', '/mapping/pci/' ~ item.0.mapping)
    | selectattr('ugid', 'equalto', item.1)
    | selectattr('roleid', 'equalto', proxmox_gpu_passthrough_role)
    | list | length == 0
