---
- name: Check that the SSH port is open
  ansible.builtin.assert:
    that:
      - (ssh_hardening_options['Port'] | default('22') | string) in (ufw_rules | map(attribute='port') | map('string') | list)
    fail_msg: "Open the SSH port in ufw_rules, or Ansible locks itself out."

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Deny incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Add each firewall rule
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default(omit) }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.rule }} {{ item.port }}/{{ item.proto | default('any') }}"

- name: Turn on UFW
  community.general.ufw:
    state: enabled
