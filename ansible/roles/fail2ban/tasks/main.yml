---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: "{{ fail2ban_packages }}"
    state: present

# The bans use UFW, so the ufw role runs first.
- name: Write the jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Start and enable Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
