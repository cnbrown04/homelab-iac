---
- name: Check the development settings
  ansible.builtin.assert:
    that:
      - dev_tools_user is match('^[a-z_][a-z0-9_-]*$')
      - dev_tools_user != admin_user_name
    fail_msg: >-
      Set dev_tools_user to a user name that is not the admin user. The role
      owner_user makes the user and its keys.

- name: Install the QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  register: dev_tools_guest_agent

# The package has no [Install] section. udev starts the agent when the VM has
# the virtio serial port. A check run does not install the package.
- name: Start the QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
  when: not (ansible_check_mode and dev_tools_guest_agent is changed)

- name: Install the development packages
  ansible.builtin.apt:
    name: "{{ dev_tools_apt_packages }}"
    state: present
  when: dev_tools_apt_packages | length > 0

- name: Delete the packages that are no longer necessary
  ansible.builtin.apt:
    name: "{{ dev_tools_apt_absent }}"
    state: absent
  when: dev_tools_apt_absent | length > 0

- name: Set the inotify limit for the editors
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "{{ dev_tools_inotify_max_user_watches }}"
    sysctl_file: /etc/sysctl.d/90-dev-tools.conf
    reload: true

# The mise repository. The package updates with the other APT packages.
- name: Download the mise APT signing key
  ansible.builtin.get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /etc/apt/keyrings/mise.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the mise APT repository
  ansible.builtin.deb822_repository:
    name: mise
    types: [deb]
    uris: https://mise.jdx.dev/deb
    suites: stable
    components: [main]
    signed_by: /etc/apt/keyrings/mise.asc
    state: present
  register: dev_tools_mise_repository

# A check run does not add the repository, so APT cannot find the package.
- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: "{{ dev_tools_mise_repository is changed }}"
  register: dev_tools_mise_package
  when: not (ansible_check_mode and dev_tools_mise_repository is changed)

- name: Create the config folder of mise
  ansible.builtin.file:
    path: "{{ dev_tools_home }}/.config/mise"
    state: directory
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0755"

- name: Write the global config of mise
  ansible.builtin.template:
    src: mise-config.toml.j2
    dest: "{{ dev_tools_home }}/.config/mise/config.toml"
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0644"
  register: dev_tools_mise_config
  notify: Delete the mise tools that are no longer necessary

# The user can change the rest of .zshrc. Ansible changes only this block.
- name: Activate mise in zsh
  ansible.builtin.blockinfile:
    path: "{{ dev_tools_home }}/.zshrc"
    create: true
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE dev_tools"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      eval "$(mise activate zsh)"
  when: not dev_tools_zsh

- name: Set up zsh
  ansible.builtin.include_tasks: zsh.yml
  when: dev_tools_zsh

- name: Copy the neovim and tmux configs
  ansible.builtin.include_tasks: dotfiles.yml
  when: dev_tools_nvim_config or dev_tools_tmux_config

# A check run does not install mise.
- name: Find the mise tools that are not installed
  ansible.builtin.command:
    cmd: mise ls --global --missing --json
  become: true
  become_user: "{{ dev_tools_user }}"
  register: dev_tools_mise_missing
  changed_when: false
  # The task only reads, so it also runs in check mode.
  check_mode: false
  when: not (ansible_check_mode and dev_tools_mise_package is changed)

# A check run does not write the new config, so mise does not see a new tool.
# Rust needs build-essential, so the APT packages come first.
- name: Install the mise tools
  ansible.builtin.command:
    cmd: mise install --yes
  become: true
  become_user: "{{ dev_tools_user }}"
  changed_when: true
  when: >-
    dev_tools_mise_config is changed
    or (dev_tools_mise_missing.stdout | default('{}') | from_json | length > 0)

# vim.pack installs each missing plugin when neovim starts, and fff.nvim then
# downloads its binary. Ansible starts neovim one time with no UI, so the
# first real start does not wait. The list comes from the lock file in the role.
- name: Install the neovim plugins
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      pack="$HOME/.local/share/nvim/site/pack/core/opt"
      missing() {
        for plugin in {{ dev_tools_nvim_plugins | map('quote') | join(' ') }}; do
          [ -d "$pack/$plugin" ] || echo "$plugin"
        done
      }
      [ -z "$(missing)" ] && exit 0
      mise exec -- nvim --headless +qa
      if [ -n "$(missing)" ]; then
        echo "Neovim did not install: $(missing | xargs)" >&2
        exit 1
      fi
      echo installed
    executable: /bin/bash
    chdir: "{{ dev_tools_home }}"
  become: true
  become_user: "{{ dev_tools_user }}"
  vars:
    dev_tools_nvim_plugins: >-
      {{ (lookup('ansible.builtin.file', 'dotfiles/nvim-pack-lock.json') | from_json).plugins
         | list }}
  register: dev_tools_nvim_plugins_install
  changed_when: "'installed' in dev_tools_nvim_plugins_install.stdout"
  when: dev_tools_nvim_config

# The build uses the Go of mise, so it comes after the mise tools.
- name: Build opkssh for the device flow
  ansible.builtin.include_tasks: opkssh.yml
  when: dev_tools_opkssh_source_ref | length > 0

- name: Install Claude Code and opencode
  ansible.builtin.include_tasks: agents.yml
  when: dev_tools_claude_code or dev_tools_opencode

# tic compiles the entry in /etc/terminfo, which ncurses reads first.
- name: Copy the terminfo entry of Ghostty
  ansible.builtin.copy:
    src: xterm-ghostty.terminfo
    dest: /usr/local/share/xterm-ghostty.terminfo
    owner: root
    group: root
    mode: "0644"
  register: dev_tools_ghostty_source
  when: dev_tools_ghostty_terminfo

- name: Compile the terminfo entry of Ghostty
  ansible.builtin.command:
    cmd: tic -x -o /etc/terminfo /usr/local/share/xterm-ghostty.terminfo
  changed_when: true
  when:
    - dev_tools_ghostty_terminfo
    - dev_tools_ghostty_source is changed
