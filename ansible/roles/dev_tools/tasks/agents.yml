---
# The installers put each tool in the home folder of the user. Each tool then
# updates itself, and the tasks below update it on each run of the role.
- name: Install Claude Code
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    executable: /bin/bash
    creates: "{{ dev_tools_home }}/.local/bin/claude"
  become: true
  become_user: "{{ dev_tools_user }}"
  when: dev_tools_claude_code

# The v2 installer. The mise registry and https://opencode.ai/install give v1.
# The role writes PATH in ~/.zshrc, so the installer must not change it.
- name: Install opencode
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
    executable: /bin/bash
    creates: "{{ dev_tools_home }}/.opencode/bin/opencode"
  become: true
  become_user: "{{ dev_tools_user }}"
  when: dev_tools_opencode

- name: Update Claude Code
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      before=$(~/.local/bin/claude --version)
      ~/.local/bin/claude update </dev/null >/dev/null
      after=$(~/.local/bin/claude --version)
      echo "$before -> $after"
    executable: /bin/bash
  become: true
  become_user: "{{ dev_tools_user }}"
  register: dev_tools_claude_update
  changed_when: (dev_tools_claude_update.stdout.split(' -> ') | unique | length) > 1
  when: dev_tools_claude_code

- name: Update opencode
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      before=$(~/.opencode/bin/opencode --version)
      ~/.opencode/bin/opencode upgrade --method curl </dev/null >/dev/null
      after=$(~/.opencode/bin/opencode --version)
      echo "$before -> $after"
    executable: /bin/bash
  become: true
  become_user: "{{ dev_tools_user }}"
  register: dev_tools_opencode_update
  changed_when: (dev_tools_opencode_update.stdout.split(' -> ') | unique | length) > 1
  when: dev_tools_opencode

# The folder holds the logins of the agents.
- name: Create the folder of the logins
  ansible.builtin.file:
    path: "{{ dev_tools_home }}/.config/dev_tools"
    state: directory
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0700"
  when: >-
    (dev_tools_claude_code and dev_tools_claude_oauth_token | length > 0)
    or (dev_tools_opencode and dev_tools_opencode_auth | length > 0)

# zsh reads this file, so each shell and each tmux pane has the token.
- name: Write the token of Claude Code
  ansible.builtin.copy:
    content: |
      # Ansible writes this file. See the role dev_tools.
      export CLAUDE_CODE_OAUTH_TOKEN={{ dev_tools_claude_oauth_token | quote }}
    dest: "{{ dev_tools_home }}/.config/dev_tools/claude.zsh"
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0600"
  no_log: true
  when:
    - dev_tools_claude_code
    - dev_tools_claude_oauth_token | length > 0

# Claude Code keeps its settings and its state in ~/.claude.json, and changes
# the file itself. Ansible sets only the keys in dev_tools_claude_config.
- name: Read the global config of Claude Code
  ansible.builtin.slurp:
    src: "{{ dev_tools_home }}/.claude.json"
  register: dev_tools_claude_json
  failed_when: false
  no_log: true
  when: dev_tools_claude_code

- name: Set the keys in the global config of Claude Code
  ansible.builtin.copy:
    content: "{{ dev_tools_claude_json_new | to_nice_json }}\n"
    dest: "{{ dev_tools_home }}/.claude.json"
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0600"
  vars:
    dev_tools_claude_json_old: >-
      {{ (dev_tools_claude_json.content | b64decode | from_json)
         if dev_tools_claude_json.content is defined else {} }}
    dev_tools_claude_json_new: "{{ dev_tools_claude_json_old | combine(dev_tools_claude_config) }}"
  no_log: true
  when:
    - dev_tools_claude_code
    - dev_tools_claude_json_old != dev_tools_claude_json_new

- name: Write the logins of opencode
  ansible.builtin.copy:
    content: "{{ dev_tools_opencode_auth }}"
    dest: "{{ dev_tools_home }}/.config/dev_tools/opencode-auth.json"
    owner: "{{ dev_tools_user }}"
    group: "{{ dev_tools_user }}"
    mode: "0600"
  no_log: true
  when:
    - dev_tools_opencode
    - dev_tools_opencode_auth | length > 0

# The import adds each login that opencode does not have, and skips each login
# that it has. So a login that opencode on the host refreshed stays.
# --standalone runs opencode without its background service.
- name: Import the logins of opencode
  ansible.builtin.command:
    cmd: >-
      {{ dev_tools_home }}/.opencode/bin/opencode auth import --standalone
      {{ dev_tools_home }}/.config/dev_tools/opencode-auth.json
  become: true
  become_user: "{{ dev_tools_user }}"
  register: dev_tools_opencode_import
  # opencode writes the result to stderr, for example "Imported 1 credential".
  changed_when: "'Imported 0 ' not in dev_tools_opencode_import.stderr"
  when:
    - dev_tools_opencode
    - dev_tools_opencode_auth | length > 0
