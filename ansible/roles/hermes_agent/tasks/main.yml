---
- name: Check the Hermes settings
  ansible.builtin.assert:
    that:
      - hermes_agent_user is match('^[a-z_][a-z0-9_-]*$')
      - hermes_agent_user != admin_user_name
      - hermes_agent_channel in ['stable', 'main']
    fail_msg: >-
      Set hermes_agent_user to a user name that is not the admin user, and
      hermes_agent_channel to stable or main.

- name: Install the packages of the Hermes installer
  ansible.builtin.apt:
    name: "{{ hermes_agent_apt_packages }}"
    state: present

# The installer clones the code, and PM installs Python, Node.js, and the
# other tools in the home folder. --non-interactive skips "hermes setup".
- name: Install Hermes Agent
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh
      | bash -s -- --non-interactive --channel {{ hermes_agent_channel }}
    executable: /bin/bash
    creates: "{{ hermes_agent_home }}/.local/bin/hermes"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_install

- name: Update Hermes Agent
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      before=$(~/.local/bin/hermes --version | head -n 1)
      ~/.local/bin/hermes update </dev/null >/dev/null
      after=$(~/.local/bin/hermes --version | head -n 1)
      echo "$before -> $after"
    executable: /bin/bash
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_update
  changed_when: (hermes_agent_update.stdout.split(' -> ') | unique | length) > 1
  when: hermes_agent_install is not changed
  notify: Restart the Hermes gateway

# Hermes changes config.yaml itself, for example after "hermes model". Ansible
# sets only the keys in hermes_agent_config. The file can hold the tokens of a
# channel, so the tasks do not show it.
- name: Read the config of Hermes
  ansible.builtin.slurp:
    src: "{{ hermes_agent_home }}/.hermes/config.yaml"
  register: hermes_agent_config_file
  failed_when: false
  no_log: true

- name: Set the keys in the config of Hermes
  ansible.builtin.copy:
    content: "{{ hermes_agent_config_new | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ hermes_agent_home }}/.hermes/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  vars:
    hermes_agent_config_old: >-
      {{ (hermes_agent_config_file.content | b64decode | from_yaml | default({}, true))
         if hermes_agent_config_file.content is defined else {} }}
    hermes_agent_config_new: "{{ hermes_agent_config_old | combine(hermes_agent_config, recursive=true) }}"
  diff: false
  when:
    - hermes_agent_config | length > 0
    - hermes_agent_config_old != hermes_agent_config_new
    # A check run does not install Hermes, so the folder is not there.
    - not (ansible_check_mode and hermes_agent_install is changed)
  notify: Restart the Hermes gateway

- name: Set the values in the env file of Hermes
  ansible.builtin.lineinfile:
    path: "{{ hermes_agent_home }}/.hermes/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  loop: "{{ hermes_agent_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: not (ansible_check_mode and hermes_agent_install is changed)
  notify: Restart the Hermes gateway

# The value comes from SOPS, so the task does not show it. A new identity
# applies to each new session after the restart.
- name: Write the identity of the agent
  ansible.builtin.copy:
    content: "{{ hermes_agent_soul }}"
    dest: "{{ hermes_agent_home }}/.hermes/SOUL.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_soul | length > 0
    - not (ansible_check_mode and hermes_agent_install is changed)
  notify: Restart the Hermes gateway

# Hermes keeps the source and the commit of each Git plugin in this file.
- name: Read the installed plugins of Hermes
  ansible.builtin.slurp:
    src: "{{ hermes_agent_home }}/.hermes/plugins/.install-metadata.json"
  register: hermes_agent_plugin_file
  failed_when: false
  when: hermes_agent_plugins | length > 0

# --yes-deps accepts the Python packages of the plugin with no prompt. --force
# replaces a plugin that has a different commit.
- name: Install the Hermes plugins
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_home }}/.local/bin/hermes plugins install {{ item.source | quote }}
      --ref {{ item.ref | quote }} --enable --yes-deps
      {{ '--force' if item.name in hermes_agent_plugins_installed else '' }}
  become: true
  become_user: "{{ hermes_agent_user }}"
  vars:
    hermes_agent_plugins_installed: >-
      {{ (hermes_agent_plugin_file.content | b64decode | from_json)
         if hermes_agent_plugin_file.content is defined else {} }}
  loop: "{{ hermes_agent_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: >-
    hermes_agent_plugins_installed[item.name].revision | default('') != item.ref
  notify: Restart the Hermes gateway

# A system service starts at boot with no login. It runs as the user, with the
# data in ~/.hermes. HOME and SUDO_USER act like "sudo hermes" of the user. The
# install runs as root, so it can leave files of root in ~/.hermes. chown gives
# them back to the user before the first start.
- name: Install the service of the Hermes gateway
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      {{ hermes_agent_home }}/.local/bin/hermes gateway install --system --run-as-user {{ hermes_agent_user | quote }}
      chown -R {{ hermes_agent_user | quote }}: {{ hermes_agent_home }}/.hermes
    executable: /bin/bash
    creates: /etc/systemd/system/hermes-gateway.service
  environment:
    HOME: "{{ hermes_agent_home }}"
    HERMES_HOME: "{{ hermes_agent_home }}/.hermes"
    SUDO_USER: "{{ hermes_agent_user }}"
  register: hermes_agent_service

# A check run does not install the service.
- name: Start the Hermes gateway
  ansible.builtin.systemd_service:
    name: hermes-gateway
    enabled: true
    state: started
  when: not (ansible_check_mode and hermes_agent_service is changed)
