---
# The user that runs Hermes Agent. The role owner_user makes the user. The
# installer puts the code in ~/.hermes/hermes-agent and the data in ~/.hermes.
hermes_agent_user: ""
hermes_agent_home: "/home/{{ hermes_agent_user }}"

# stable follows the releases. main follows each commit. Each run of the role
# runs "hermes update" on this channel.
hermes_agent_channel: stable

# APT installs these packages first. The Node.js of the installer needs
# libatomic1, and the installer cannot use sudo with a password.
hermes_agent_apt_packages:
  - curl
  - git
  - libatomic1

# The keys that Ansible sets in ~/.hermes/config.yaml. Hermes keeps the other
# keys. A list replaces the list in the file.
hermes_agent_config: {}

# The values that Ansible sets in ~/.hermes/.env, as NAME: value. Hermes keeps
# the other lines. Put the values in secrets.sops.yml of the host.
hermes_agent_env: {}

# The identity of the agent: the content of ~/.hermes/SOUL.md. Hermes puts it
# first in the system prompt, and it never writes the file itself. Empty: the
# role does not touch the file. Put the value in secrets.sops.yml of the host.
hermes_agent_soul: ""

# The plugins from Git, each with a name, a source, and a full commit SHA:
#   - name: my-plugin
#     source: owner/repo
#     ref: 0123456789abcdef0123456789abcdef01234567
# The name is the name in plugin.yaml. Ansible installs and enables a missing
# plugin, and installs the plugin again when the commit changes. A plugin that
# you delete from this list stays. Run "hermes plugins remove <name>".
# The plugins that ship with Hermes, for example Photon, need no entry.
hermes_agent_plugins: []
