---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  register: unattended_upgrades_package

- name: Turn on the daily upgrade
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Limit the upgrades to the security updates of Debian
  ansible.builtin.copy:
    src: 51unattended-upgrades-security-only
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-security-only
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_debian_security_only | bool

# A check run does not install the package, so the service does not exist yet.
- name: Start and enable unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
  when: not (ansible_check_mode and unattended_upgrades_package is changed)
