---
- name: Configure Proxmox hosts
  hosts: proxmox_nodes
  roles:
    - role: common
    - role: admin_user
      tags: [admin_user]
    - role: ssh_hardening
      tags: [security]
    - role: sysctl_hardening
      tags: [security]
    - role: unattended_upgrades
      tags: [security]
    - role: proxmox_network
      tags: [proxmox_network]
    - role: tailscale
      tags: [tailscale]
    - role: proxmox_web
      tags: [proxmox_web]
    - role: zfs_nfs
      tags: [zfs_nfs]
      when: zfs_nfs_pool | default('') | length > 0
    - role: proxmox_gpu_passthrough
      tags: [proxmox_gpu_passthrough]
      when: proxmox_gpu_passthrough_devices | default([]) | length > 0
