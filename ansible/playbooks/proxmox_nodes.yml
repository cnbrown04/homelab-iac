---
- name: Configure Proxmox hosts
  hosts: proxmox_nodes
  # The roles use the facts of min and network only. The hardware facts are
  # the slowest.
  gather_subset: [min, network]
  roles:
    - role: common
    - role: admin_user
      tags: [admin_user]
    - role: owner_user
      tags: [owner_user]
    - role: ssh_hardening
      tags: [security]
    - role: opkssh
      tags: [security, opkssh]
    - role: sysctl_hardening
      tags: [security]
    - role: unattended_upgrades
      tags: [security]
    - role: proxmox_network
      tags: [proxmox_network]
    - role: tailscale
      tags: [tailscale]
    - role: proxmox_web
      tags: [proxmox_web]
    - role: zfs_nfs
      tags: [zfs_nfs]
      when: zfs_nfs_pool | default('') | length > 0
    # A mapping needs its folder, so this role comes after zfs_nfs.
    - role: proxmox_dir_mapping
      tags: [proxmox_dir_mapping]
      when: proxmox_dir_mapping_folders | default([]) | length > 0
    - role: proxmox_gpu_passthrough
      tags: [proxmox_gpu_passthrough]
      when: proxmox_gpu_passthrough_devices | default([]) | length > 0
