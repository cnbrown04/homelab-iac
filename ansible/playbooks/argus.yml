---
# Run this play by hand. No pipeline reaches the VM.
#
# The first run after OpenTofu creates the VM: cloud-init gave iac-admin sudo
# with no password. The play deletes the cloud-init rule. The admin_user role
# gives iac-admin its own rule.
- name: Configure argus
  hosts: siem_servers
  # The roles use the facts of min and network only. The hardware facts are
  # the slowest.
  gather_subset: [min, network]
  roles:
    - role: common
    - role: admin_user
      tags: [admin_user]
    - role: owner_user
      tags: [owner_user]
    - role: ssh_hardening
      tags: [security]
    - role: opkssh
      tags: [security, opkssh]
    - role: sysctl_hardening
      tags: [security]
    - role: unattended_upgrades
      tags: [security]
    - role: tailscale
      tags: [tailscale]
    # The manager watches its own host, so argus gets no agent.
    - role: wazuh_server
      tags: [wazuh_server]
    # Pangolin sends wazuh.buildwithcaleb.com through Newt to the dashboard.
    - role: newt
      tags: [newt]
  tasks:
    - name: Delete the sudo rule of cloud-init
      ansible.builtin.file:
        path: /etc/sudoers.d/90-cloud-init-users
        state: absent
      tags: [admin_user]
