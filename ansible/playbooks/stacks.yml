---
- name: Deploy application stacks on hermes
  hosts: hermes
  tasks:
    - name: Deploy each declared Compose stack
      ansible.builtin.include_role:
        name: compose_stack
      vars:
        compose_stack_name: "{{ item }}"
        compose_stack_source: "{{ playbook_dir }}/../stacks/{{ item }}"
        compose_stack_environment: "{{ hermes_compose_stack_environment.get(item, {}) }}"
      loop: "{{ hermes_compose_stacks }}"
      loop_control:
        label: "{{ item }}"
