---
- name: Configure hermes
  hosts: hermes
  # The roles use the facts of min and network only. The hardware facts are
  # the slowest.
  gather_subset: [min, network]
  roles:
    - role: common
    - role: admin_user
      tags: [admin_user]
    - role: owner_user
      tags: [owner_user]
    - role: ssh_hardening
      tags: [security]
    - role: opkssh
      tags: [security, opkssh]
    - role: sysctl_hardening
      tags: [security]
    - role: unattended_upgrades
      tags: [security]
    - role: ufw
      tags: [security]
    - role: fail2ban
      tags: [security]
    - role: crowdsec
      tags: [security]
    - role: docker
      tags: [docker]
    - role: pangolin
      tags: [pangolin]
    # Dockge joins the pangolin network, so it comes after Pangolin.
    - role: dockge
      tags: [dockge]
    - role: pocket_id
      tags: [pocket_id]
    # The backup comes last, after each application that it backs up.
    - role: backup
      tags: [backup]
