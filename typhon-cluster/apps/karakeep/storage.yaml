# The volumes of Karakeep, on the disk of a worker. SQLite must not go on NFS.
# - data: db.db, the SQLite database, and assets/, the screenshots and the
#   archives of each page.
# - meilisearch: the search index. Karakeep can make it again from the
#   database (admin settings, "Reindex all bookmarks").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
