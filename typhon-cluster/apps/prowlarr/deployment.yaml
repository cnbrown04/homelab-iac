# Prowlarr. Pangolin puts its SSO login in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # User 1000 owns the old config. No fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A new config volume gets the old config folder from data/migrate/
        # one time. To restore a backup, put the folder there, and delete the
        # claim config.
        - name: seed-config
          image: docker.io/library/busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -e /config/prowlarr.db ] && [ -e /seed/migrate/prowlarr.db ]; then
                cp -R /seed/migrate/. /config/
                rm -f /config/prowlarr.pid
                echo "Copied the config from /seed/migrate."
              fi
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /seed
      containers:
        - name: prowlarr
          image: ghcr.io/home-operations/prowlarr:2.6.5.5623
          env:
            # No login page. The Pangolin login (Pocket ID) is the only login,
            # so the Pangolin resource must keep SSO on. The API still needs
            # the API key.
            - name: PROWLARR__AUTH__METHOD
              value: External
          ports:
            - name: http
              containerPort: 9696
          securityContext: *container-security
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /config/Backups
              subPath: Backups
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir: {}
