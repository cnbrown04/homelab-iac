# The volumes of HolyArrs:
# - media: /lethe/data/media on gaia, at /media. qBittorrent saves to
#   /media/downloads. One volume lets HolyArrs make hard links, not copies.
# - config: the SQLite databases, the settings, the backups, and the master
#   key holyarrs.key, on the disk of a worker. SQLite must not go on NFS.
# The static volume keeps its data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: holyarrs-media
spec:
  capacity:
    storage: 4Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: holyarrs
    name: media
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: holyarrs-media
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: holyarrs-media
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
