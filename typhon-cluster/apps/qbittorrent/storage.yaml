# The volumes of qBittorrent:
# - media: /lethe/data/media on gaia, at /media. It saves to /media/downloads,
#   and the old resume data has that path. Sonarr, Radarr, and Chaptarr see
#   the same paths.
# - data: /lethe/k8s/qbittorrent on gaia. migrate/ holds the old config
#   folder for the first start.
# - config: the settings and the resume data, on the disk of a worker.
# The static volumes keep their data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-media
spec:
  capacity:
    storage: 4Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: qbittorrent
    name: media
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: qbittorrent-media
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-data
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: qbittorrent
    name: data
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: qbittorrent-data
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/k8s/qbittorrent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: qbittorrent-media
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: qbittorrent-data
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
