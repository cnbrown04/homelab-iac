# Kaneo, the project management. Its users log in with Pocket ID, so Pangolin
# does not put SSO in front of it. The image runs the API on Node.js and the
# web app with nginx. Node.js breaks section 5 of AGENTS.md. The owner chose
# Kaneo as an exception on 6 October 2026.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Kaneo
    glance/icon: sh:kaneo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kaneo
  template:
    metadata:
      labels:
        app: kaneo
    spec:
      # The image runs as appuser (1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kaneo
          image: ghcr.io/usekaneo/kaneo:2.35.0
          env:
            # The API is at <client URL>/api.
            - name: KANEO_CLIENT_URL
              value: https://kaneo.buildwithcaleb.com
            # Pocket ID is the only login. The callback URL is
            # https://kaneo.buildwithcaleb.com/api/auth/oauth2/callback/custom.
            - name: CUSTOM_OAUTH_DISCOVERY_URL
              value: https://auth.buildwithcaleb.com/.well-known/openid-configuration
            - name: CUSTOM_OAUTH_SCOPES
              value: openid,profile,email
            - name: DISABLE_LOGIN_FORM
              value: "true"
            - name: DISABLE_PASSWORD_REGISTRATION
              value: "true"
            - name: DISABLE_EMAIL_OTP_SIGN_IN
              value: "true"
            - name: DISABLE_GUEST_ACCESS
              value: "true"
          # DATABASE_URL (the database kaneo on PlanetScale), AUTH_SECRET,
          # CUSTOM_OAUTH_CLIENT_ID, and CUSTOM_OAUTH_CLIENT_SECRET.
          envFrom:
            - secretRef:
                name: kaneo
          ports:
            - name: http
              containerPort: 5173
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
