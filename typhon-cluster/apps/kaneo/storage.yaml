# The volume of the backups of Kaneo, in /lethe/k8s/kaneo/Backups on gaia,
# for the daily pg_dump. Ansible creates the folder. See zfs_nfs_directories
# of gaia. The database is on PlanetScale. The volume keeps its data when the
# claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kaneo-backups
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: kaneo
    name: backups
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: kaneo-backups
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/k8s/kaneo/Backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: kaneo-backups
  resources:
    requests:
      storage: 10Gi
