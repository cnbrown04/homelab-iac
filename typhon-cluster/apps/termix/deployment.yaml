# Termix, the web SSH client. Its users log in with Pocket ID, and the
# Pangolin login stays in front of it, because it opens SSH to the hosts.
#
# A Tailscale sidecar joins the tailnet as the node termix, with tag:termix.
# It runs in kernel mode, so each container of the pod reaches the tailnet
# with no proxy: SSH from Termix, and RDP and VNC from guacd. The SOCKS5 proxy
# on localhost:1055 stays for the hosts that still have it in their settings.
#
# guacd, the Guacamole proxy, runs in the pod for the remote desktop plugin.
# It listens on localhost only. GUACD_HOST tells Termix where it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Termix
    glance/icon: sh:termix
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only. Two pods with the same
  # Tailscale state take the node from each other.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
    spec:
      automountServiceAccountToken: false
      # The image runs Termix as the user node, 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The opkssh plugin reads its config from the data volume, and writes
        # its binary next to it. So this container copies the config from git
        # at each start, and the folder stays writable.
        - name: opkssh-config
          image: ghcr.io/lukegus/termix:26.10.0
          command:
            - sh
            - -c
            - >-
              mkdir -p /app/data/plugin-data/opkssh &&
              install -m 600 /config/config.yml /app/data/plugin-data/opkssh/config.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: opkssh-config
              mountPath: /config
              readOnly: true
        # A sidecar: it runs for the life of the pod. Termix starts after the
        # node is on the tailnet.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.5
          restartPolicy: Always
          env:
            - name: TS_USERSPACE
              value: "false"
            - name: TS_SOCKS5_SERVER
              value: localhost:1055
            # Keep the state on the volume, not in a Kubernetes secret. The
            # pod has no token for the API.
            - name: TS_KUBE_SECRET
              value: ""
            # A folder in the volume. tailscaled sets the mode of the folder,
            # and user 1000 does not own the root of the volume.
            - name: TS_STATE_DIR
              value: /var/lib/tailscale/state
            - name: TS_HOSTNAME
              value: termix
            # The key is for the first login only. Then the state logs in.
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: --login-server=https://vpn.buildwithcaleb.com
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            # The kubelet probes the pod IP, so the endpoint is not on
            # localhost only. It gives the health status, not the metrics.
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale
                  key: TS_AUTHKEY
          # Kernel mode makes the device tailscale0 and its routes. It needs
          # root and NET_ADMIN, so the namespace is privileged.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: [NET_ADMIN]
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tailscale
              mountPath: /var/lib/tailscale
            - name: tailscale-tmp
              mountPath: /tmp
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:26.10.0
          env:
            - name: PORT
              value: "8080"
            - name: GUACD_HOST
              value: 127.0.0.1
            - name: GUACD_PORT
              value: "4822"
            # The opkssh plugin uses the same opkssh as the hosts. Keep it
            # at opkssh_version of ansible/roles/opkssh. The checksum is the
            # one of opkssh-linux-amd64 in checksums.txt of the release.
            - name: OPKSSH_VERSION
              value: v0.17.0
            - name: OPKSSH_SHA256_AMD64
              value: 7da9090ce4abb448683b6770af5efd30d0e6f2c0667cb9b4ddef9a4da3dfc88e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: guacd
          image: docker.io/guacamole/guacd:1.6.0
          # The image listens on 0.0.0.0. Termix is in the same pod, so
          # localhost is enough.
          command: ["/opt/guacamole/sbin/guacd"]
          args: ["-b", "127.0.0.1", "-l", "4822", "-L", "info", "-f"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tailscale
          persistentVolumeClaim:
            claimName: tailscale
        - name: tailscale-tmp
          emptyDir: {}
        - name: opkssh-config
          configMap:
            name: termix-opkssh
