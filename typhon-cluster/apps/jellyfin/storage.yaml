# The volumes of Jellyfin:
# - media: /lethe/data/media on gaia. The old database has the libraries at
#   /media/movies, /media/tv, and /media/anime, so the pod mounts it at /media.
#   Jellyfin writes subtitles next to the media, so the volume is not
#   read-only.
# - transcode: the dataset lethe/data/media/transcode on gaia, at the default
#   transcode folder /cache/transcodes. User 1000 must own it.
# - data: /lethe/k8s/jellyfin on gaia. metadata/ holds the images and the
#   metadata of the libraries. migrate/ holds the old config, data, plugins,
#   and root folders for the first start. No SQLite.
# - config: the SQLite database and the settings, on the disk of a worker.
#   SQLite must not go on NFS.
# The static volumes keep their data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  capacity:
    storage: 4Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: jellyfin
    name: media
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-media
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-transcode
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: jellyfin
    name: transcode
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-transcode
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media/transcode
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-data
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: jellyfin
    name: data
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-data
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/k8s/jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transcode
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-transcode
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-data
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
