# The volumes of Seerr:
# - data: /lethe/k8s/seerr on gaia. migrate/ holds the old config folder for
#   the first start.
# - config: settings.json and the SQLite database, on the disk of a worker.
#   SQLite must not go on NFS.
# The static volume keeps its data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-data
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: seerr
    name: data
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: seerr-data
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/k8s/seerr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: seerr-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
