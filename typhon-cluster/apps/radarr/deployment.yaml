# Radarr. Pangolin puts its SSO login in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      # User 1000 owns the media. No fsGroup: the kubelet would change the
      # owner of each file in the media.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A new config volume gets the old config folder from data/migrate/
        # one time. To restore a backup, put the folder there, and delete the
        # claim config.
        - name: seed-config
          image: docker.io/library/busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -e /config/radarr.db ] && [ -e /seed/migrate/radarr.db ]; then
                cp -R /seed/migrate/. /config/
                rm -f /config/radarr.pid
                echo "Copied the config from /seed/migrate."
              fi
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /seed
      containers:
        - name: radarr
          image: ghcr.io/home-operations/radarr:6.4.4.10685
          env:
            # No login page. The Pangolin login (Pocket ID) is the only login,
            # so the Pangolin resource must keep SSO on. The API still needs
            # the API key.
            - name: RADARR__AUTH__METHOD
              value: External
          ports:
            - name: http
              containerPort: 7878
          securityContext: *container-security
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /config/Backups
              subPath: Backups
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: tmp
          emptyDir: {}
