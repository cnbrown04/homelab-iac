apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filebrowser
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# A change to config.yaml gives the ConfigMap a new name, so the pod restarts.
configMapGenerator:
  - name: filebrowser-config
    files:
      - config.yaml
