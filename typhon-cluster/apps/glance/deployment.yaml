# The dashboard of the homelab. Glance has no login, so Pangolin puts its SSO
# login in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Glance
    glance/icon: di:glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      serviceAccountName: glance
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glance
          image: docker.io/glanceapp/glance:v0.8.6
          # Go loads each certificate in this folder, also the CA of the
          # cluster. Then Glance trusts the Kubernetes API.
          env:
            - name: SSL_CERT_DIR
              value: /run/secrets
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            # Glance reads ${secret:<name>} from /run/secrets/<name>.
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glance-config
        - name: secrets
          projected:
            sources:
              - secret:
                  name: glance-kube-token
                  items:
                    - key: token
                      path: kube-token
                    - key: ca.crt
                      path: kube-ca.crt
              - secret:
                  name: glance-secrets
