# The dashboard of the homelab: Dynacat, a fork of Glance. It has no login of
# its own here, so Pangolin puts its SSO login in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Dynacat
    glance/icon: di:dynacat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      serviceAccountName: glance
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glance
          image: docker.io/panonim/dynacat:3.0.2
          env:
            # Git holds the config, and the ConfigMap is read-only. So the
            # editor in the page stays off.
            - name: ENABLE_EDITOR
              value: "false"
            # Go loads each certificate in this folder, also the CA of the
            # cluster. Then Dynacat trusts the Kubernetes API.
            - name: SSL_CERT_DIR
              value: /run/secrets
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            # Dynacat reads ${secret:<name>} from /run/secrets/<name>.
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            # Dynacat does not start without a writable cache folder. The
            # root of the container is read-only.
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: config
          configMap:
            name: glance-config
        - name: cache
          emptyDir: {}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: glance-kube-token
                  items:
                    - key: token
                      path: kube-token
                    - key: ca.crt
                      path: kube-ca.crt
              - secret:
                  name: glance-secrets
