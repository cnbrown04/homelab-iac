# The config of Glance. See https://github.com/glanceapp/glance/blob/main/docs/configuration.md.
server:
  port: 8080
  # Pangolin and the Gateway are in front of Glance.
  proxied: true

# Catppuccin Macchiato (dark) and Latte (light), from docs/themes.md of
# Glance. They replace the two default themes of the theme picker. The picker
# also shows the base theme as "default", and the style in document.head
# hides it.
theme:
  background-color: 232 23 18
  contrast-multiplier: 1.2
  primary-color: 220 83 75
  positive-color: 105 48 72
  negative-color: 351 74 73
  presets:
    default-dark:
      background-color: 232 23 18
      contrast-multiplier: 1.2
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73
    default-light:
      light: true
      background-color: 220 23 95
      contrast-multiplier: 1.0
      primary-color: 220 91 54
      positive-color: 109 58 40
      negative-color: 347 87 44

# Glance keeps the theme in a cookie and has no setting to follow the system.
# This script picks the preset that matches the color scheme of the system,
# and changes it when the system changes. It uses the API of the theme picker,
# so the picker must stay on. Glance reads ${...} as an environment variable,
# so the script must not use template strings.
document:
  head: |
    <style>
    .theme-preset[data-key="default"] { display: none; }
    html .theme-choices:has(> :nth-child(3)) { --presets-per-row: 2; }
    .big-clock { text-align: center; padding: 1rem 0; }
    .big-clock-time { font-size: clamp(4rem, 10vw, 7rem); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .big-clock-seconds { font-size: 0.3em; margin-left: 0.3em; letter-spacing: 0; }
    .bookmark-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem 1.6rem; font-size: 1.2rem; }
    .bookmark-bar a { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--color-text-subdue); }
    .bookmark-bar a:hover { color: var(--color-text-highlight); }
    .bookmark-bar img { width: 1.4rem; height: 1.4rem; }
    /* A black icon, for example GitHub, is white on the dark theme. */
    [data-scheme="dark"] .bookmark-bar img.mono { filter: invert(1); }
    .weekly-issue .rss-detailed-thumbnail > * { height: 14rem; }
    .weekly-issue .rss-detailed-description { -webkit-line-clamp: 4; line-clamp: 4; }
    .weekly-issue .attachments { display: none; }
    /* glance-k8s draws a server icon for each node. The mask shows the Talos
       logo in its place, in the color of the state of the node. */
    .typhon-nodes .server-icon path { display: none; }
    .typhon-nodes .server-icon {
      background-color: currentColor;
      -webkit-mask: url("https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/talos.svg") center / contain no-repeat;
      mask: url("https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/talos.svg") center / contain no-repeat;
    }
    </style>
    <script>
    (function () {
      var query = window.matchMedia("(prefers-color-scheme: light)");
      function follow() {
        var key = query.matches ? "default-light" : "default-dark";
        if (document.documentElement.getAttribute("data-theme") === key) return;
        fetch("/api/set-theme/" + key, { method: "POST" }).then(function (response) {
          if (!response.ok) return;
          return response.text().then(function (css) {
            function apply() {
              var style = document.getElementById("theme-style");
              if (style) style.textContent = css;
              document.documentElement.setAttribute("data-theme", key);
              document.documentElement.setAttribute("data-scheme", response.headers.get("X-Scheme"));
              if (window.pageData) window.pageData.theme = key;
            }
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", apply);
            } else {
              apply();
            }
          });
        });
      }
      follow();
      query.addEventListener("change", follow);
    })();

    // The large clock of the page Home. Glance loads the widgets after
    // this script, so each tick finds the clocks again.
    (function () {
      function pad(n) { return n < 10 ? "0" + n : String(n); }
      function tick() {
        var clocks = document.querySelectorAll("[data-big-clock]");
        if (!clocks.length) return;
        var now = new Date();
        var parts = {
          time: (now.getHours() % 12 || 12) + ":" + pad(now.getMinutes()),
          seconds: pad(now.getSeconds()),
          period: now.getHours() < 12 ? "AM" : "PM",
          date: now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }),
          utc: "UTC " + pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes())
        };
        clocks.forEach(function (clock) {
          clock.querySelectorAll("[data-part]").forEach(function (part) {
            part.textContent = parts[part.getAttribute("data-part")];
          });
        });
      }
      tick();
      setInterval(tick, 1000);
    })();
    </script>

# Shared templates for the page "Homelab". Glance does not read this key. The
# widgets use the templates through YAML anchors.
lab-templates:
  # The nodes of a Proxmox cluster, from /cluster/resources?type=node.
  proxmox-nodes: &proxmox-nodes |
    {{ if ne .Response.StatusCode 200 }}
    <p class="color-negative">Proxmox answered {{ .Response.Status }}. Check the API token.</p>
    {{ else }}
    <ul class="list list-gap-14">
    {{ range sortByString "node" "asc" (.JSON.Array "data") }}
      <li>
        <div class="flex justify-between items-center">
          <a class="size-h4 color-highlight" href="https://{{ .String "node" }}.vnet.buildwithcaleb.com" target="_blank" rel="noreferrer">{{ .String "node" }}</a>
          {{ if eq (.String "status") "online" }}
          <span class="size-h6 color-positive">up {{ div (.Int "uptime") 86400 }}d</span>
          {{ else }}
          <span class="size-h6 color-negative">{{ .String "status" }}</span>
          {{ end }}
        </div>
        {{ if eq (.String "status") "online" }}
        {{ $cpu := mul (.Float "cpu") 100.0 }}
        {{ $mem := mul (div (.Float "mem") (.Float "maxmem")) 100.0 }}
        {{ $disk := mul (div (.Float "disk") (.Float "maxdisk")) 100.0 }}
        <div class="flex gap-15 margin-top-5">
          <div class="flex-1 min-width-0">
            <div class="flex justify-between size-h6"><span>CPU · {{ .Int "maxcpu" }}</span><span class="color-highlight">{{ printf "%.0f" $cpu }}%</span></div>
            <div class="progress-bar"><div class="progress-value{{ if ge $cpu 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $cpu }}"></div></div>
          </div>
          <div class="flex-1 min-width-0">
            <div class="flex justify-between size-h6"><span>RAM · {{ printf "%.0f" (div (.Float "maxmem") 1073741824.0) }} GiB</span><span class="color-highlight">{{ printf "%.0f" $mem }}%</span></div>
            <div class="progress-bar"><div class="progress-value{{ if ge $mem 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $mem }}"></div></div>
          </div>
          <div class="flex-1 min-width-0">
            <div class="flex justify-between size-h6"><span>Root disk</span><span class="color-highlight">{{ printf "%.0f" $disk }}%</span></div>
            <div class="progress-bar"><div class="progress-value{{ if ge $disk 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $disk }}"></div></div>
          </div>
        </div>
        {{ end }}
      </li>
    {{ end }}
    </ul>
    {{ end }}

  # The VMs and containers of a Proxmox cluster, from
  # /cluster/resources?type=vm. Templates are not in the list. A VM with the
  # tag talos is a node of typhon, and the typhon nodes tab shows it, so it is
  # not in the list. When no guest is left, the widget shows a short text.
  proxmox-guests: &proxmox-guests |
    {{ if ne .Response.StatusCode 200 }}
    <p class="color-negative">Proxmox answered {{ .Response.Status }}. Check the API token.</p>
    {{ else }}
    {{ $shown := 0 }}
    <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
    {{ range sortByInt "vmid" "asc" (.JSON.Array "data") }}
    {{ if and (ne (.Int "template") 1) (eq (findMatch "(^|;)talos(;|$)" (.String "tags")) "") }}
    {{ $shown = add $shown 1 }}
      <li class="flex items-center gap-10">
        <span class="{{ if eq (.String "status") "running" }}color-positive{{ else }}color-subdue{{ end }}">●</span>
        <div class="grow min-width-0">
          <div class="color-highlight text-truncate">{{ .String "name" }}</div>
          <div class="size-h6 color-subdue">{{ .Int "vmid" }} · {{ .String "node" }} · {{ if eq (.String "type") "lxc" }}LXC{{ else }}VM{{ end }}</div>
        </div>
        {{ if eq (.String "status") "running" }}
        <div class="size-h6 text-right shrink-0">
          <div>{{ printf "%.0f" (mul (.Float "cpu") 100.0) }}% of {{ .Int "maxcpu" }} CPU</div>
          <div>{{ printf "%.1f" (div (.Float "mem") 1073741824.0) }} / {{ printf "%.0f" (div (.Float "maxmem") 1073741824.0) }} GiB</div>
        </div>
        {{ else }}
        <div class="size-h6 color-subdue shrink-0">{{ .String "status" }}</div>
        {{ end }}
      </li>
    {{ end }}
    {{ end }}
    </ul>
    {{ if eq $shown 0 }}
    <p class="color-subdue">No guests outside typhon.</p>
    {{ end }}
    {{ end }}

  # The storage of a Proxmox cluster, from /cluster/resources?type=storage.
  proxmox-storage: &proxmox-storage |
    {{ if ne .Response.StatusCode 200 }}
    <p class="color-negative">Proxmox answered {{ .Response.Status }}. Check the API token.</p>
    {{ else }}
    <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
    {{ range sortByString "storage" "asc" (.JSON.Array "data") }}
    {{ if eq (.String "status") "available" }}
    {{ $used := mul (div (.Float "disk") (.Float "maxdisk")) 100.0 }}
      <li>
        <div class="flex justify-between size-h6">
          <span><span class="color-highlight">{{ .String "storage" }}</span> · {{ .String "node" }}</span>
          <span>{{ printf "%.0f" (div (.Float "disk") 1073741824.0) }} / {{ printf "%.0f" (div (.Float "maxdisk") 1073741824.0) }} GiB</span>
        </div>
        <div class="progress-bar"><div class="progress-value{{ if ge $used 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $used }}"></div></div>
      </li>
    {{ end }}
    {{ end }}
    </ul>
    {{ end }}

pages:
  # The start page: a clock, a bar of links, search, Self-Host Weekly, Hacker
  # News, and Lobsters. It has one
  # column, so the widgets use the full width of a slim page.
  - name: Home
    slug: home
    width: slim
    center-vertically: true
    # The clock and the weather of Auburn. The script in document.head fills
    # each [data-big-clock]. Glance gets the weather from Open-Meteo, which
    # needs no key. When Open-Meteo fails, the clock shows with no weather.
    head-widgets:
      - type: custom-api
        hide-header: true
        frameless: true
        cache: 15m
        url: https://api.open-meteo.com/v1/forecast
        parameters:
          latitude: 32.6099
          longitude: -85.4808
          current: temperature_2m,weather_code
          daily: temperature_2m_max,temperature_2m_min,precipitation_probability_max
          temperature_unit: fahrenheit
          timezone: America/Chicago
          forecast_days: 1
        template: |
          <div class="big-clock" data-big-clock>
            <div class="big-clock-time color-highlight"><span data-part="time">--:--</span><span class="big-clock-seconds color-subdue"><span data-part="seconds">--</span> <span data-part="period"></span></span></div>
            <div class="size-h3 margin-top-10" data-part="date"></div>
            <div class="size-h5 color-subdue margin-top-5">
              {{ if eq .Response.StatusCode 200 }}
              {{ $code := .JSON.Int "current.weather_code" }}
              <span class="color-highlight">{{ printf "%.0f" (.JSON.Float "current.temperature_2m") }}°F</span>
              · {{ if eq $code 0 }}Clear{{ else if eq $code 1 }}Mainly clear{{ else if eq $code 2 }}Partly cloudy{{ else if eq $code 3 }}Overcast{{ else if le $code 48 }}Fog{{ else if le $code 57 }}Drizzle{{ else if le $code 67 }}Rain{{ else if le $code 77 }}Snow{{ else if le $code 82 }}Showers{{ else if le $code 86 }}Snow showers{{ else }}Thunderstorm{{ end }}
              · H {{ printf "%.0f" (.JSON.Float "daily.temperature_2m_max.0") }}° L {{ printf "%.0f" (.JSON.Float "daily.temperature_2m_min.0") }}°
              · {{ .JSON.Int "daily.precipitation_probability_max.0" }}% rain ·
              {{ end }}
              <span data-part="utc"></span>
            </div>
          </div>
    columns:
      - size: full
        widgets:
          # A small bar of links. The style is in document.head.
          - type: html
            source: |
              <nav class="bookmark-bar">
                <a href="https://github.com/cnbrown04/homelab-iac" target="_blank" rel="noreferrer"><img class="mono" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/github.svg" alt="">GitHub</a>
                <a href="https://gaia.vnet.buildwithcaleb.com" target="_blank" rel="noreferrer"><img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proxmox.svg" alt="">Proxmox</a>
                <a href="https://seerr.buildwithcaleb.com" target="_blank" rel="noreferrer"><img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyseerr.svg" alt="">Seerr</a>
                <a href="https://homeassistant.buildwithcaleb.com" target="_blank" rel="noreferrer"><img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/home-assistant.svg" alt="">Home Assistant</a>
                <a href="https://bambuddy.buildwithcaleb.com" target="_blank" rel="noreferrer"><img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/bambu-lab.svg" alt="">Bambuddy</a>
              </nav>

          - type: search
            search-engine: duckduckgo
            autofocus: true

          # The newest issue of Self-Host Weekly, as one large card. This feed
          # has only the issues of the newsletter, not the blog.
          - type: rss
            title: Self-Host Weekly
            title-url: https://selfh.st/weekly/
            css-class: weekly-issue
            style: detailed-list
            limit: 1
            cache: 6h
            feeds:
              - url: https://selfh.st/weekly/rss/

          # The top 10 of Hacker News and of Lobsters, side by side. -1 shows
          # all items, with no button to show more. The front page of Hacker
          # News (top) mixes points and age. best has the posts with the most
          # points of about the last two days, in the order of the points.
          - type: split-column
            max-columns: 2
            widgets:
              - type: hacker-news
                sort-by: best
                limit: 10
                collapse-after: -1
              - type: lobsters
                tags: [devops, linux, networking]
                sort-by: hot
                limit: 10
                collapse-after: -1

  # The videos and Reddit. The news is on the page Home.
  - name: Feed
    slug: feed
    width: wide
    columns:
      - size: full
        widgets:
          - type: videos
            style: grid-cards
            collapse-after-rows: 1
            # YouTube answers 404 for the feed with no Shorts (playlist
            # UULF...). The feed of the channel works, but it has the Shorts.
            include-shorts: true
            # Glance takes the ID of a channel only, not the link. The comment
            # gives the link. To find the ID of a channel, open its page and
            # look for "channel/UC..." in the canonical link of the source.
            channels:
              - UCZNhwA1B5YqiY1nLzmM0ZRg # Christian Lempa, https://www.youtube.com/@christianlempa
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling, https://www.youtube.com/@JeffGeerling
              - UCsnGwSIHyoYN0kiINAGUKxg # Wolfgang's Channel, https://www.youtube.com/@WolfgangsChannel
              - UCHkYOD-3fZbuGhwsADBd9ZQ # Lawrence Systems, https://www.youtube.com/@LAWRENCESYSTEMS
              - UCOk-gHyjcWZNj3Br4oxwh0A # Techno Tim, https://www.youtube.com/@TechnoTim
              - UCYeiozh-4QwuC1sjgCmB92w # DevOps Toolbox, https://www.youtube.com/@devopstoolbox
              - UCJa14zeVf8p6clixTOIOVyQ # jakkuh, https://www.youtube.com/@jakkuh_t
              - UCgdTVe88YVSrOZ9qKumhULQ # Hardware Haven, https://www.youtube.com/@HardwareHaven
              - UCWQaM7SpSECp9FELz-cHzuQ # Dreams of Code, https://www.youtube.com/@dreamsofcode
              - UCmlzNHg8QiWVutUyFOV2UdQ # The Stock Pot, https://www.youtube.com/@TheStockPot-AU
              - UC4w1YQAJMWOz4qtxinq55LQ # Level1Techs, https://www.youtube.com/@Level1Techs
              - UCp3yVOm6A55nx65STpm3tXQ # Craft Computing, https://www.youtube.com/@CraftComputing
              - UCx0ObGO7YJZpPPf6tbHpqPQ # Servers at Home, https://www.youtube.com/@ServersatHome
              - UCv6J_jJa8GJqFwQNgNrMuww # ServeTheHome, https://www.youtube.com/@ServeTheHomeVideo

          - type: split-column
            max-columns: 2
            widgets:
              - type: reddit
                subreddit: homelab
                show-thumbnails: true
                collapse-after: 5
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
                collapse-after: 5

  # The homelab: the Proxmox nodes and guests, typhon, the pipelines, the storage,
  # and the releases.
  - name: Homelab
    slug: homelab
    width: wide
    columns:
      - size: full
        widgets:
          # Each Proxmox widget uses the read-only token of glance@pve. The
          # API uses the IP, because the cluster resolves .vnet to hermes.
          - type: group
            widgets:
              - type: custom-api
                title: pantheon
                cache: 1m
                url: https://10.0.1.120:8006/api2/json/cluster/resources
                parameters:
                  type: node
                allow-insecure: true
                headers:
                  Authorization: "PVEAPIToken=glance@pve!glance=${secret:proxmox-pantheon-token}"
                template: *proxmox-nodes
              - type: custom-api
                title: atlas
                cache: 1m
                url: https://10.0.1.124:8006/api2/json/cluster/resources
                parameters:
                  type: node
                allow-insecure: true
                headers:
                  Authorization: "PVEAPIToken=glance@pve!glance=${secret:proxmox-atlas-token}"
                template: *proxmox-nodes

          - type: group
            widgets:
              - type: custom-api
                title: pantheon guests
                cache: 1m
                url: https://10.0.1.120:8006/api2/json/cluster/resources
                parameters:
                  type: vm
                allow-insecure: true
                headers:
                  Authorization: "PVEAPIToken=glance@pve!glance=${secret:proxmox-pantheon-token}"
                template: *proxmox-guests
              - type: custom-api
                title: atlas guests
                cache: 1m
                url: https://10.0.1.124:8006/api2/json/cluster/resources
                parameters:
                  type: vm
                allow-insecure: true
                headers:
                  Authorization: "PVEAPIToken=glance@pve!glance=${secret:proxmox-atlas-token}"
                template: *proxmox-guests

          # glance-k8s gives the nodes and the apps. See glance-k8s.yaml. The
          # Flux tab reads the cluster with the read-only service account
          # glance. See rbac.yaml.
          - type: group
            widgets:
              - type: extension
                title: typhon nodes
                css-class: typhon-nodes
                url: http://glance-k8s.glance.svc.cluster.local/extension/nodes
                allow-potentially-dangerous-html: true
                cache: 30s

              - type: extension
                title: typhon apps
                url: http://glance-k8s.glance.svc.cluster.local/extension/apps
                allow-potentially-dangerous-html: true
                cache: 30s
                parameters:
                  show-if: |
                    "glance/name" in annotations

              - type: custom-api
                title: Flux
                cache: 1m
                url: https://kubernetes.default.svc/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations
                headers:
                  Authorization: "Bearer ${secret:kube-token}"
                subrequests:
                  helmreleases:
                    url: https://kubernetes.default.svc/apis/helm.toolkit.fluxcd.io/v2/helmreleases
                    headers:
                      Authorization: "Bearer ${secret:kube-token}"
                  sources:
                    url: https://kubernetes.default.svc/apis/source.toolkit.fluxcd.io/v1/gitrepositories
                    headers:
                      Authorization: "Bearer ${secret:kube-token}"
                template: |
                  {{ $helm := .Subrequest "helmreleases" }}
                  {{ $sources := .Subrequest "sources" }}
                  {{ if or (ne .Response.StatusCode 200) (ne $helm.Response.StatusCode 200) (ne $sources.Response.StatusCode 200) }}
                  <p class="color-negative">The Kubernetes API answered {{ .Response.Status }}.</p>
                  {{ else }}
                  {{ $revision := $sources.JSON.String `items.#(metadata.name=="homelab-iac").status.artifact.revision` }}
                  {{ $commit := findSubmatch "sha1:([0-9a-f]{7})" $revision }}
                  <div class="flex justify-between items-center">
                    <div>
                      <div class="size-h6">main is at</div>
                      <a class="size-h3 color-highlight" href="https://github.com/cnbrown04/homelab-iac/commit/{{ $commit }}" target="_blank" rel="noreferrer">{{ $commit }}</a>
                    </div>
                    <div class="size-h6 text-right">fetched <span {{ parseRelativeTime "rfc3339" ($sources.JSON.String `items.#(metadata.name=="homelab-iac").status.artifact.lastUpdateTime`) }}></span> ago</div>
                  </div>
                  <div class="size-h6 margin-top-15">Kustomizations</div>
                  <ul class="list list-gap-4 margin-top-5">
                  {{ range .JSON.Array "items" }}
                  {{ $ready := .String `status.conditions.#(type=="Ready").status` }}
                    <li class="flex items-center gap-10">
                      <span class="{{ if eq $ready "True" }}color-positive{{ else }}color-negative{{ end }}">●</span>
                      <span class="grow text-truncate">{{ .String "metadata.name" }}</span>
                      <span class="size-h6 color-subdue shrink-0">{{ findSubmatch "^([^@]+)@" (.String "status.lastAppliedRevision") }}@{{ findSubmatch "sha1:([0-9a-f]{7})" (.String "status.lastAppliedRevision") }}</span>
                    </li>
                  {{ end }}
                  </ul>
                  <div class="size-h6 margin-top-15">Helm releases</div>
                  <ul class="list list-gap-4 margin-top-5">
                  {{ range $helm.JSON.Array "items" }}
                  {{ $ready := .String `status.conditions.#(type=="Ready").status` }}
                    <li class="flex items-center gap-10">
                      <span class="{{ if eq $ready "True" }}color-positive{{ else }}color-negative{{ end }}">●</span>
                      <span class="grow text-truncate">{{ .String "metadata.name" }}</span>
                      <span class="size-h6 color-subdue shrink-0">{{ .String "status.history.0.chartVersion" }}</span>
                    </li>
                  {{ end }}
                  </ul>
                  {{ end }}

          # The repository is public. GitHub allows 60 requests an hour with
          # no token, so the cache is 10 minutes.
          - type: group
            widgets:
              - type: custom-api
                title: Pipelines
                title-url: https://github.com/cnbrown04/homelab-iac/actions
                cache: 10m
                url: https://api.github.com/repos/cnbrown04/homelab-iac/actions/runs
                parameters:
                  per_page: 8
                headers:
                  Accept: application/vnd.github+json
                template: |
                  {{ if ne .Response.StatusCode 200 }}
                  <p class="color-negative">GitHub answered {{ .Response.Status }}.</p>
                  {{ else }}
                  <ul class="list list-gap-10">
                  {{ range .JSON.Array "workflow_runs" }}
                  {{ $status := .String "status" }}
                  {{ $result := .String "conclusion" }}
                    <li class="flex items-center gap-10">
                      <span class="{{ if eq $result "success" }}color-positive{{ else if or (eq $result "failure") (eq $result "timed_out") (eq $result "startup_failure") }}color-negative{{ else if eq $status "completed" }}color-subdue{{ else }}color-primary{{ end }}">●</span>
                      <div class="grow min-width-0">
                        <div class="text-truncate"><a class="color-highlight" href="{{ .String "html_url" }}" target="_blank" rel="noreferrer">{{ .String "display_title" }}</a></div>
                        <div class="size-h6 color-subdue">{{ .String "name" }} · {{ .String "event" }} · <span {{ parseRelativeTime "rfc3339" (.String "created_at") }}></span> ago</div>
                      </div>
                      <span class="size-h6 shrink-0{{ if eq $status "waiting" }} color-primary{{ end }}">{{ if eq $status "completed" }}{{ $result }}{{ else if eq $status "waiting" }}needs approval{{ else }}{{ $status }}{{ end }}</span>
                    </li>
                  {{ end }}
                  </ul>
                  {{ end }}

              - type: repository
                title: Repository
                repository: cnbrown04/homelab-iac
                cache: 1h
                pull-requests-limit: 5
                issues-limit: 3
                commits-limit: 5

      - size: small
        widgets:
          - type: custom-api
            title: pantheon storage
            cache: 5m
            url: https://10.0.1.120:8006/api2/json/cluster/resources
            parameters:
              type: storage
            allow-insecure: true
            headers:
              Authorization: "PVEAPIToken=glance@pve!glance=${secret:proxmox-pantheon-token}"
            template: *proxmox-storage

          - type: releases
            cache: 6h
            show-source-icon: true
            limit: 10
            collapse-after: 5
            repositories:
              - siderolabs/talos
              - kubernetes/kubernetes
              - fluxcd/flux2
              - cilium/cilium
              - opentofu/opentofu
              - ansible/ansible
              - home-assistant/core
              - fosrl/newt
              - tale/headplane
              - louislam/dockge

