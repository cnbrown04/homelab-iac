apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance
resources:
  - namespace.yaml
  - rbac.yaml
  - secrets.sops.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# A change to glance.yml gives the ConfigMap a new name, so the pod restarts.
configMapGenerator:
  - name: glance-config
    files:
      - glance.yml
