# Pangolin sends home.buildwithcaleb.com through the site typhon to the
# Gateway main. The Host header stays the same, so this route matches it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - home.buildwithcaleb.com
  rules:
    - backendRefs:
        - name: glance
          port: 8080
