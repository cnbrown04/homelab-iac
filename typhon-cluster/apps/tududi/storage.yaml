# The volume of Tududi, on the disk of a worker. The database is on PlanetScale.
# - db/: the SQLite database of Tududi 1.x. Tududi 2.0 does not read it.
# - uploads/: the attachments.
# - backups/: the backups that the owner makes in the UI.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
