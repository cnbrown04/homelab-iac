# The volume of the bundle, on the disk of a worker. MongoDB and BadgerDB must
# not go on NFS. It holds:
# - bundle-config.yml: the settings and the private keys of the network. If
#   this file goes away, each app must join a new network.
# - mongo/ and redis/: the databases of the coordinator and the file node.
# - storage/storage-sync/: the spaces of each user.
# The files of Anytype go to the R2 bucket, not to this volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
