# The backend of Multica, in Go. It runs the database migrations at each
# start, then the API and the WebSocket server. The database is on
# PlanetScale and needs the extension vector.
#
# Multica has no OIDC. Pangolin puts the Pocket ID login in front of it, and
# only the addresses in ALLOWED_EMAILS can make an account. With no email
# service, the backend writes each login code to its log:
#   kubectl -n multica logs deploy/multica-backend | grep "Verification code"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multica-backend
  template:
    metadata:
      labels:
        app: multica-backend
    spec:
      # The image runs as root by default. The backend writes only to the
      # uploads, and user 1000 owns that folder on gaia.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/multica-ai/multica-backend:v0.6.1
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: MULTICA_APP_URL
              value: https://multica.buildwithcaleb.com
            # The origin also allows the WebSocket upgrade.
            - name: FRONTEND_ORIGIN
              value: https://multica.buildwithcaleb.com
            - name: CORS_ALLOWED_ORIGINS
              value: https://multica.buildwithcaleb.com
            - name: ALLOW_SIGNUP
              value: "false"
            - name: DO_NOT_TRACK
              value: "1"
            - name: LOCAL_UPLOAD_DIR
              value: /app/data/uploads
            # PlanetScale is on the internet, so the first connection can be
            # slow.
            - name: MULTICA_DATABASE_CONNECT_TIMEOUT
              value: 15s
          # DATABASE_URL, JWT_SECRET, and ALLOWED_EMAILS.
          envFrom:
            - secretRef:
                name: multica
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: multica-backend
spec:
  selector:
    app: multica-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
