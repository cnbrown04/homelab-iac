# One hostname: the WebSocket goes to the backend, and each other request goes
# to the web app. The web app sends /api to the backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multica
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - multica.buildwithcaleb.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: multica-backend
          port: 8080
    - backendRefs:
        - name: multica-web
          port: 3000
