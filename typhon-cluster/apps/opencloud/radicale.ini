# The config of Radicale. From opencloud-compose, config/radicale/config.
# The pod sets --hosts, so this file has no [server] section.
[auth]
type = http_x_remote_user

[storage]
filesystem_folder = /var/lib/radicale/collections
# Each user gets a calendar and an address book at the first login.
predefined_collections = {
    "def-addressbook": {
       "D:displayname": "Personal Address Book",
       "tag": "VADDRESSBOOK"
    },
    "def-calendar": {
       "C:supported-calendar-component-set": "VEVENT,VJOURNAL,VTODO",
       "D:displayname": "Personal Calendar",
       "tag": "VCALENDAR"
    }
  }

[web]
type = none
