# The extra routes of the proxy of OpenCloud. The proxy logs in each user,
# then sends CalDAV and CardDAV to Radicale with the user name in
# X-Remote-User. From opencloud-compose, config/opencloud/proxy.yaml.
additional_policies:
  - name: default
    routes:
      - endpoint: /caldav/
        backend: http://127.0.0.1:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /.well-known/caldav
        backend: http://127.0.0.1:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /carddav/
        backend: http://127.0.0.1:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
      - endpoint: /.well-known/carddav
        backend: http://127.0.0.1:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
