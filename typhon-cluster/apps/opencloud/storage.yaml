# The volumes of OpenCloud:
# - lethe: /lethe/opencloud on gaia. The pod mounts three folders of it:
#   config (opencloud.yaml, with the secrets that opencloud init makes),
#   users (the files of the users), and radicale (the calendars and
#   contacts). Ansible makes the dataset and the folders.
# - data: the rest of /var/lib/opencloud, on the disk of a worker. It holds
#   the user accounts of the IDM, the shares, NATS, the search index, and
#   the thumbnails. These use databases that must not go on NFS.
# The static volume keeps its data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opencloud-lethe
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: opencloud
    name: lethe
  # OpenCloud keeps its metadata in xattrs. NFS gives xattrs from 4.2 only.
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: opencloud-lethe
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/opencloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lethe
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: opencloud-lethe
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
