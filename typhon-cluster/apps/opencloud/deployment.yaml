# OpenCloud, with Radicale for the calendars and contacts. Users log in with
# Pocket ID, and OpenCloud creates each user at the first login. Its desktop
# and mobile apps cannot pass the Pangolin login, so Pangolin does not put
# SSO in front of it.
# Pocket ID has one public client, opencloud, with PKCE. WebFinger gives its
# ID to the web, desktop, Android, and iOS clients. The Pocket ID groups
# opencloud_admins, opencloud_spaceadmins, opencloud_users, and
# opencloud_guests set the claim opencloud_role. A user with no group cannot
# log in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
spec:
  replicas: 1
  # NATS and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      # User 1000 owns /lethe/opencloud. No fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud-rolling:8.0.1
          # opencloud init makes the config one time. It fails when the
          # config exists, so the error is ignored.
          command:
            - /bin/sh
            - -c
            - opencloud init || true; exec opencloud server
          env:
            - name: OC_URL
              value: https://cloud.buildwithcaleb.com
            # The Gateway ends TLS, so the proxy uses HTTP.
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            # Pocket ID replaces the built-in IDP.
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: OC_OIDC_ISSUER
              value: https://auth.buildwithcaleb.com
            - name: OC_OIDC_CLIENT_ID
              value: opencloud
            # Pocket ID sends the groups and opencloud_role only with the
            # scope groups. The apps also need offline_access for a refresh
            # token.
            - name: WEB_OIDC_SCOPE
              value: openid profile email groups
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_IOS_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEB_OIDC_METADATA_URL
              value: https://auth.buildwithcaleb.com/.well-known/openid-configuration
            - name: WEB_OIDC_RESPONSE_TYPE
              value: code
            # The apps find the issuer through the well-known URL of OpenCloud.
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: none
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: preferred_username
            - name: PROXY_AUTOPROVISION_CLAIM_EMAIL
              value: email
            - name: PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME
              value: name
            - name: PROXY_AUTOPROVISION_CLAIM_GROUPS
              value: groups
            - name: PROXY_USER_OIDC_CLAIM
              value: preferred_username
            - name: PROXY_USER_CS3_CLAIM
              value: username
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: opencloud_role
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            - name: GRAPH_USERNAME_MATCH
              value: none
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            - name: OC_LOG_LEVEL
              value: info
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: lethe
              mountPath: /etc/opencloud
              subPath: config
            - name: opencloud-config
              mountPath: /etc/opencloud/proxy.yaml
              subPath: proxy.yaml
            - name: opencloud-config
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
            - name: data
              mountPath: /var/lib/opencloud
            # The posix driver keeps the files as normal files here.
            - name: lethe
              mountPath: /var/lib/opencloud/storage/users
              subPath: users
        - name: radicale
          image: docker.io/opencloudeu/radicale:v3.8.1
          # Radicale trusts X-Remote-User, so it listens on localhost only.
          # The image sets 0.0.0.0 on the command line, and that overrides
          # the config file.
          args: ["--hosts", "127.0.0.1:5232"]
          securityContext: *container-security
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: radicale
              mountPath: /etc/radicale/config
              subPath: radicale.ini
            - name: lethe
              mountPath: /var/lib/radicale
              subPath: radicale
      volumes:
        - name: lethe
          persistentVolumeClaim:
            claimName: lethe
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: opencloud-config
          configMap:
            name: opencloud-config
        - name: radicale
          configMap:
            name: radicale-config
