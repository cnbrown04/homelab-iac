apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencloud
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# A change to a config file gives the ConfigMap a new name, so the pod
# restarts.
configMapGenerator:
  - name: opencloud-config
    files:
      - proxy.yaml
      - csp.yaml
  - name: radicale-config
    files:
      - radicale.ini
