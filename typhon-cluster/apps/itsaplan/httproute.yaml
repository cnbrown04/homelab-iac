# The api is at /api on the web host. The route removes /api, so the api gets
# /projects, /api/auth/..., and /mcp, the same as on a host of its own. The
# OAuth documents of MCP go to the api with no change.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itsaplan
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - plan.buildwithcaleb.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
        - path:
            type: PathPrefix
            value: /.well-known/openid-configuration
      backendRefs:
        - name: api
          port: 3000
    - backendRefs:
        - name: web
          port: 3001
