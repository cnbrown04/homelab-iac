# Jackett, for Chaptarr. It has its own login, and Pangolin puts its SSO
# login in front of it. The image starts Jackett with
# --NoUpdates, so Renovate updates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Jackett
    glance/icon: di:jackett
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      # User 1000 owns the config. No fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jackett
          image: ghcr.io/home-operations/jackett:0.24.2780
          ports:
            - name: http
              containerPort: 9117
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: tmp
          emptyDir: {}
