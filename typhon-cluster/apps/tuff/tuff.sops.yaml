# The secrets of Tuff. Each password is a random value of letters and digits,
# because Tuff writes it into a URL as it is.
# - POSTGRES_PASSWORD is the password of the superuser tracker. DATABASE_URL
#   uses it for the migrations. Tuff gives tracker_app and tracker_worker the
#   passwords in their URLs at each start.
# - JWT_SECRET signs the sessions. ENCRYPTION_KEY encrypts the second factors
#   and the tokens of the integrations.
# - SETUP_TOKEN opens the setup page one time, until the server has an owner.
# - GITHUB_SIGNIN_CLIENT_ID and GITHUB_SIGNIN_CLIENT_SECRET are the GitHub
#   OAuth App of "Sign in with GitHub". When they are empty, the button is off.
