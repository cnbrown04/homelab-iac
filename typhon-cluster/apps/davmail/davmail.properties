# The settings of DavMail. Only CalDAV (and CardDAV) is on. See
# https://davmail.sourceforge.net/serversetup.html.
davmail.server=true
davmail.allowRemote=true
davmail.bindAddress=
davmail.disableUpdateCheck=true

# Microsoft turned off EWS in Exchange Online in October 2026, so DavMail
# uses Graph.
davmail.mode=O365Graph

# The device code flow needs no browser on the pod. At the first CalDAV
# login, the log of the pod shows a URL and a code. Open the URL and log in
# to Auburn there. DavMail then keeps the refresh token in tokenFilePath.
davmail.authentication=O365DeviceCode
davmail.oauth.persistToken=true
davmail.oauth.tokenFilePath=/config/.env.oauth

# Pangolin gives the HTTPS. The other listeners are off.
davmail.caldavPort=1080
davmail.imapPort=
davmail.ldapPort=
davmail.popPort=
davmail.smtpPort=
davmail.ssl.nosecurecaldav=true

davmail.enableKeepAlive=true
davmail.caldavPastDelay=90
davmail.caldavAutoSchedule=true

# The pod logs to stdout. The file stays small, in the emptyDir /tmp.
davmail.logFilePath=/tmp/davmail.log
davmail.logFileSize=1MB
log4j.logger.davmail=INFO
# The probe of the pod connects every 30 seconds. Do not log each connection.
log4j.logger.davmail.connection=WARN
log4j.logger.httpclient.wire=WARN
log4j.logger.httpclient=WARN
log4j.rootLogger=WARN
