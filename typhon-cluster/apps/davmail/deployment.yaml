# DavMail, a CalDAV gateway to the Microsoft 365 calendar of Auburn. Pangolin
# gives no login, because a CalDAV app cannot pass it. The CalDAV app logs in
# with the Auburn email and a password that the owner chooses. DavMail
# encrypts the refresh token with that password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davmail
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: DavMail
    glance/icon: di:microsoft-outlook
spec:
  replicas: 1
  # A local-path volume allows one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: davmail
  template:
    metadata:
      labels:
        app: davmail
    spec:
      # The image has no user, so it runs as root. The pod runs as 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: davmail
          image: ghcr.io/mguessan/davmail:7.1.0
          env:
            - name: HOME
              value: /tmp
            # The entrypoint reads the settings from this file.
            - name: DAVMAIL_PROPERTIES
              value: /etc/davmail/davmail.properties
            - name: JAVA_OPT_USER
              value: -XX:MaxRAMPercentage=75
          ports:
            - name: caldav
              containerPort: 1080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: caldav
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/davmail
              readOnly: true
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings
          configMap:
            name: davmail
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: tmp
          emptyDir: {}
