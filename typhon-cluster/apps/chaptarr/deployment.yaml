# Chaptarr, the audiobooks and ebooks of the library. It has its own login, and
# Pangolin puts its SSO login in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaptarr
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaptarr
  template:
    metadata:
      labels:
        app: chaptarr
    spec:
      # User 1000 owns the media. No fsGroup: the kubelet would change the
      # owner of each file in the media.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A new config volume gets the old config folder from data/migrate/
        # one time. To restore a backup, put the folder there, and delete the
        # claim config.
        - name: seed-config
          image: docker.io/library/busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -e /config/chaptarr.db ] && [ -e /seed/migrate/chaptarr.db ]; then
                cp -R /seed/migrate/. /config/
                rm -f /config/chaptarr.pid
                echo "Copied the config from /seed/migrate."
              fi
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /seed
      containers:
        - name: chaptarr
          image: docker.io/chaptarr/chaptarr:0.9.965
          ports:
            - name: http
              containerPort: 8789
          securityContext: *container-security
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /config/Backups
              subPath: Backups
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: tmp
          emptyDir: {}
