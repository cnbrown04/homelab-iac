# The agent names the cluster after the context of its kubeconfig. In the
# cluster, it has no context, so this file gives it the name typhon. It uses
# the token of the service account, which the kubelet keeps current.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-agent-kubeconfig
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: typhon
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: pulse-agent
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: typhon
        context:
          cluster: typhon
          user: pulse-agent
    current-context: typhon
