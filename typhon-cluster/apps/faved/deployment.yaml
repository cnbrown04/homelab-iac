# Faved, the bookmark manager. It has its own login, and the Chrome extension
# and the Apple Shortcut cannot pass the Pangolin login, so SSO is off. Faved
# has no login until it has a user: make the user before the Pangolin
# resource exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faved
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Faved
    glance/icon: sh:faved
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: faved
  template:
    metadata:
      labels:
        app: faved
    spec:
      # The image starts Apache as root by default. The PHP image also runs as
      # a different user, and the sysctl lets that user open port 80.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: faved
          image: docker.io/denho/faved:2.10.1
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Apache serves / as a static file. The API needs the login.
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
