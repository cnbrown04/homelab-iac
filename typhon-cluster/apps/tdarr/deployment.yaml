# Tdarr: the server and one internal node in one pod. Pangolin puts its SSO
# login in front of it. It transcodes on the iGPU of hyperion, so it runs on
# typhon-w-3 only. The GPU plugin shares the iGPU with Jellyfin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  # The widget of glance-k8s shows each Deployment with glance/name.
  annotations:
    glance/name: Tdarr
    glance/icon: di:tdarr
spec:
  replicas: 1
  # SQLite and a local-path volume allow one pod only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      # User 1000 owns the media. The image skips its chown and user setup
      # when it does not start as root. /dev/dri/renderD128 on Talos has mode
      # 666, so the pod needs no render group. No fsGroup: the kubelet would
      # change the owner of each file in the media.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Each subPath folder and the mount point of the backups must exist
        # before Tdarr starts. A folder that the kubelet makes belongs to
        # root, and Tdarr cannot write in it.
        - name: make-folders
          image: docker.io/library/busybox:1.38
          command:
            - mkdir
            - -p
            - /config/server/Tdarr/Backups
            - /config/configs
            - /media/tdarr-cache
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:3.04.00
          env:
            # s6 refuses a /run that root owns. An emptyDir always belongs to
            # root.
            - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
              value: "1"
            # No login page. The Pangolin login (Pocket ID) is the only login,
            # so the Pangolin resource must keep SSO on.
            - name: auth
              value: "false"
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: typhon-w-3
          ports:
            - name: http
              containerPort: 8265
          securityContext: *container-security
          readinessProbe:
            httpGet:
              path: /api/v2/status
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 3Gi
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: run
              mountPath: /run
            - name: config
              mountPath: /app/server
              subPath: server
            - name: config
              mountPath: /app/configs
              subPath: configs
            - name: backups
              mountPath: /app/server/Tdarr/Backups
            - name: logs
              mountPath: /app/logs
            - name: media
              mountPath: /media
            # Set /temp as the cache of each library in the UI.
            - name: media
              mountPath: /temp
              subPath: tdarr-cache
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: backups
          persistentVolumeClaim:
            claimName: backups
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: media
          persistentVolumeClaim:
            claimName: media
