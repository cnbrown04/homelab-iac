# The volumes of Tdarr:
# - media: /lethe/data/media on gaia, at /media. Tdarr replaces each file in
#   the library. Its cache is the folder tdarr-cache in the same dataset, so
#   a finished file moves into the library with no copy. The cache is not in
#   the transcode dataset, because Jellyfin deletes the old files there.
# - data: /lethe/k8s/tdarr on gaia. Backups/ holds the backups of Tdarr. No
#   SQLite. The driver gives the folder to user 1000 at each mount.
# - config: the SQLite database and the settings, on the disk of a worker.
#   SQLite must not go on NFS.
# The static volumes keep their data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tdarr-media
spec:
  capacity:
    storage: 4Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: tdarr
    name: media
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: tdarr-media
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: tdarr-media
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tdarr-data
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: tdarr
    name: data
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: tdarr-data
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/k8s/tdarr
      uid: "1000"
      gid: "1000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: tdarr-data
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
