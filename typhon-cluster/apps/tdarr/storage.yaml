# The volumes of Tdarr:
# - media: /lethe/data/media on gaia, at /media. Tdarr replaces each file in
#   the library. Its cache is the folder tdarr-cache in the same dataset, so
#   a finished file moves into the library with no copy. The cache is not in
#   the transcode dataset, because Jellyfin deletes the old files there.
# - backups: the backups of Tdarr, on a dynamic volume in /lethe/k8s. No
#   SQLite.
# - config: the SQLite database and the settings, on the disk of a worker.
#   SQLite must not go on NFS.
# The static volume keeps its data when the claim goes away.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tdarr-media
spec:
  capacity:
    storage: 4Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: tdarr
    name: media
  mountOptions: [nfsvers=4.2, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: tdarr-media
    volumeAttributes:
      server: 10.0.20.5
      share: /lethe/data/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: tdarr-media
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-lethe
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
