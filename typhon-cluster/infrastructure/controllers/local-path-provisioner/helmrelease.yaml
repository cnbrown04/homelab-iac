# Volumes on the disk of a node, for SQLite. SQLite must not go on NFS. Talos
# gives each worker the volume u-local-path at /var/mnt/local-path. See
# talos/talconfig.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
  values:
    storageClass:
      name: local-path
      defaultClass: false
      reclaimPolicy: Delete
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path
    helperImage:
      tag: "1.37"
