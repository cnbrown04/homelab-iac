# The NFS driver. The StorageClass nfs-lethe is in configs/storage. It points
# to gaia on VLAN 20.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.5
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  values:
    # The chart can make a snapshot class. The cluster has no snapshot CRDs.
    externalSnapshotter:
      enabled: false
