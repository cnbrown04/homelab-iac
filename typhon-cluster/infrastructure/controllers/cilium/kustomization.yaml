# Flux takes over the release that the owner installed with helm. The values
# stay in values.yaml, so the same file serves a new install by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
