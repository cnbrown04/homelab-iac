apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
# The one Gateway of the cluster, on 10.0.20.200. The Pangolin site sends the
# public traffic here, and Pangolin terminates TLS. An app adds an HTTPRoute
# in its own namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.0.20.200
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
