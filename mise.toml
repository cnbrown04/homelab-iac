# Tool versions for this repo. Identical on every machine.
#
#   mise install    # fetch everything below
#   mise doctor     # diagnose a broken setup
#
# Versions are pinned exactly and bumped by Renovate, not by hand.

[tools]
# Creates and changes Proxmox resources. See AGENTS.md, section 4, decision 1.
opentofu = "1.13.1"

# Configures hosts that are already running. Collections live in
# ansible/requirements.yml, not here.
python = "3.14.8"
# Mitogen goes into the environment of ansible-core, because Ansible imports
# its strategy plugin. See ansible/ansible.cfg. Renovate bumps the two
# together. Each version of Mitogen supports a set of ansible-core versions.
ansible-core = { version = "2.21.4", uvx_args = "--with mitogen==0.3.53" }

# Lints the Ansible content on every PR. Check collection compatibility in
# ansible/requirements.yml before a version bump.
"pypi:ansible-lint" = "26.8.0"

# Secret encryption. See AGENTS.md, section 4, decision 6.
sops = "3.13.3"
age = "1.3.2"

# Installs the PyPI-backed tools above. Not used directly.
uv = "latest"

# Lints scripts/*.sh on every PR.
"aqua:koalaman/shellcheck" = "0.11.0"

# The typhon cluster. See typhon-cluster/. Keep talosctl at the Talos version
# of the nodes, in typhon-cluster/talos/talconfig.yaml.
talosctl = "1.14.2"
talhelper = "3.1.17"
kubectl = "1.37.1"
flux2 = "2.9.6"
helm = "4.3.0"
cilium-cli = "0.20.1"
# Checks the manifests of the typhon cluster in the pipeline. See
# .github/workflows/typhon.yml.
kubeconform = "0.8.0"

[env]
# Ansible reads ansible/ansible.cfg from each folder of the repository, so each
# command runs from the root. The pipelines use the same file.
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
# macOS kills a forked Ansible worker that makes an HTTP request, as the url
# lookup of admin_user does. Other systems ignore this variable.
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
# talosctl and kubectl use the files of the typhon cluster. talhelper and
# talosctl write them to clusterconfig/, which git ignores.
TALOSCONFIG = "{{config_root}}/typhon-cluster/talos/clusterconfig/talosconfig"
KUBECONFIG = "{{config_root}}/typhon-cluster/talos/clusterconfig/kubeconfig"

[settings]
# Keep tool resolution to this file: ignore stray .python-version /
# .terraform-version files that other tooling may drop in the repo.
idiomatic_version_file_enable_tools = []
# Use a precompiled Python only. A build from source takes minutes, and the
# runner has no bz2, lzma, or readline for it.
python.compile = false

# Short commands for the checks. Each task makes no change. Put more flags of
# ansible-playbook after --, for example: mise run check:hermes -- --tags pangolin
[tasks."check:hermes"]
description = "Check hermes with Ansible. The pipeline runs the same check."
run = "ansible-playbook ansible/playbooks/site.yml --check --diff --limit hermes"

[tasks."check:proxmox"]
description = "Check the Proxmox nodes with Ansible"
run = "ansible-playbook ansible/playbooks/proxmox_nodes.yml --check --diff"

[tasks."check:mnemosyne"]
description = "Check mnemosyne with Ansible"
run = "ansible-playbook ansible/playbooks/mnemosyne.yml --check --diff"

[tasks."check:daedalus"]
description = "Check daedalus with Ansible"
run = "ansible-playbook ansible/playbooks/daedalus.yml --check --diff"

[tasks."check:all"]
description = "Check each host with Ansible"
run = "ansible-playbook ansible/playbooks/site.yml --check --diff"

[tasks."lint:ansible"]
description = "Lint the Ansible content, as the pipeline does"
dir = "{{config_root}}/ansible"
run = "ansible-lint"

[tasks."plan:atlas"]
description = "Plan the OpenTofu target atlas"
shell = "bash -c"
run = "source scripts/tofu-env.sh atlas && tofu -chdir=tofu/targets/atlas plan"

[tasks."plan:pantheon"]
description = "Plan the OpenTofu target pantheon"
shell = "bash -c"
run = "source scripts/tofu-env.sh pantheon && tofu -chdir=tofu/targets/pantheon plan"
